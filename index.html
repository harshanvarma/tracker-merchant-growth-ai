<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracker — Merchant Growth AI</title>
<meta name="description" content="An AI business partner for every Paytm merchant. Works with or
without billing data, tells you what to do, and cannot invent a number.">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  /* Paytm palette */
  --pb:#00BAF2; --pb-d:#009ED4; --pb-l:#E5F7FE; --pb-ll:#F2FBFE;
  --navy:#002970; --navy-2:#013E8F; --navy-d:#001B4D;
  --ok:#17A673; --ok-l:#E7F7F1;
  --warn:#E8921B; --warn-l:#FDF4E6;
  --bad:#E0393E; --bad-l:#FDECEC;
  --ink:#0B1524; --ink-2:#36465C; --mut:#6B7A90; --faint:#95A3B6;
  --line:#E3EAF2; --line-2:#EFF4F9; --bg:#F4F7FA; --card:#fff;
  --r:14px; --r-s:10px;
  --sh:0 1px 2px rgba(11,21,36,.05),0 3px 12px rgba(11,21,36,.055);
  --sh-l:0 12px 44px rgba(0,41,112,.17);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.022em;line-height:1.25}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C6D2E1;border-radius:8px;border:2.5px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
svg{display:block;overflow:visible}

/* ============================ SETUP ============================ */
#setup{position:fixed;inset:0;z-index:50;overflow-y:auto;
  background:linear-gradient(165deg,#013E8F 0%,#002970 55%,#001B4D 100%)}
#setup.off{display:none}
.sw{min-height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:36px 18px 50px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.logo-m{width:40px;height:40px;border-radius:12px;background:var(--pb);display:grid;
  place-items:center;box-shadow:0 6px 20px rgba(0,186,242,.45);flex:0 0 auto}
.logo-t{color:#fff;font-size:21px;font-weight:680;letter-spacing:-.03em}
.logo-s{color:#8FB8E8;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:650;margin-top:1px}
.scard{width:100%;max-width:700px;background:#fff;border-radius:20px;box-shadow:var(--sh-l);
  padding:30px 32px 26px;animation:up .32s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sdots{display:flex;gap:6px;margin-bottom:20px}
.sdot{height:4px;flex:1;border-radius:3px;background:var(--line);transition:.3s}
.sdot.on{background:var(--pb)}.sdot.done{background:#B7E9FA}
.sstep{font-size:11px;font-weight:700;color:var(--pb-d);letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:6px}
.sq{font-size:23px;font-weight:660;letter-spacing:-.03em;margin-bottom:5px}
.sh{color:var(--mut);font-size:13.5px;margin-bottom:20px;max-width:56ch}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:620px){.cgrid{grid-template-columns:repeat(2,1fr)}}
.ct{padding:15px 10px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;
  text-align:center;transition:.15s}
.ct:hover{border-color:var(--pb);background:var(--pb-ll);transform:translateY(-1px)}
.ct.on{border-color:var(--pb);background:var(--pb-l);box-shadow:0 0 0 3px #CCF0FC}
.ce{font-size:23px;display:block;margin-bottom:6px;line-height:1}
.cn{font-weight:600;font-size:12.5px;line-height:1.3}
.subs{display:flex;flex-wrap:wrap;gap:7px}
.sub{padding:8px 14px;border:1.5px solid var(--line);border-radius:30px;font-size:13px;
  font-weight:550;background:#fff;transition:.14s}
.sub:hover{border-color:var(--pb)}
.sub.on{border-color:var(--pb);background:var(--pb);color:#fff}
.bopt{display:flex;gap:13px;align-items:flex-start;text-align:left;padding:17px 18px;
  border:1.5px solid var(--line);border-radius:var(--r);background:#fff;transition:.15s;
  width:100%;margin-bottom:10px}
.bopt:hover{border-color:var(--pb);background:var(--pb-ll)}
.bopt.on{border-color:var(--pb);background:var(--pb-l);box-shadow:0 0 0 3px #CCF0FC}
.bi{width:40px;height:40px;border-radius:11px;background:var(--pb-l);color:var(--pb-d);
  display:grid;place-items:center;flex:0 0 auto}
.bopt.on .bi{background:var(--pb);color:#fff}
.bt{font-weight:630;font-size:14.5px;margin-bottom:2px}
.bd{color:var(--mut);font-size:12.5px;line-height:1.45}
.sfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;
  padding-top:18px;border-top:1px solid var(--line-2)}
.btn{padding:11px 21px;border-radius:var(--r-s);font-weight:620;font-size:14px;transition:.15s}
.btn-p{background:var(--navy);color:#fff}.btn-p:hover{background:var(--navy-2)}
.btn-p:disabled{background:#C3CEDE;cursor:not-allowed}
.btn-b{background:var(--pb);color:#fff}.btn-b:hover{background:var(--pb-d)}
.btn-g{color:var(--mut)}.btn-g:hover{color:var(--ink)}
.btn-o{border:1.5px solid var(--line);background:#fff;font-weight:600}
.btn-o:hover{border-color:var(--pb);color:var(--pb-d)}
.btn-s{padding:7px 14px;font-size:12.5px;border-radius:9px}

/* ============================ SHELL ============================ */
#app{display:none;min-height:100vh;flex-direction:column}
#app.on{display:flex}
.top{background:var(--navy);color:#fff;padding:0}
.top-r{display:flex;align-items:center;gap:14px;padding:12px 22px;max-width:1440px;
  margin:0 auto;width:100%}
.top-l{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.top-l .logo-m{width:30px;height:30px;border-radius:9px;box-shadow:none}
.top-n{font-weight:670;font-size:16px;letter-spacing:-.025em}
.mbox{flex:1;min-width:0;display:flex;align-items:center;gap:9px;justify-content:flex-end}
.mname{font-weight:600;font-size:13.5px;text-align:right;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.mmeta{font-size:11px;color:#9FC3EC}
.tagb{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.03em;
  background:rgba(255,255,255,.15);color:#fff;white-space:nowrap}
.tagb.on{background:var(--pb)}
.swbtn{background:rgba(255,255,255,.12);border-radius:9px;padding:7px 11px;font-size:12px;
  font-weight:600;transition:.14s;white-space:nowrap}
.swbtn:hover{background:rgba(255,255,255,.22)}
.lang{background:rgba(255,255,255,.12);border-radius:9px;padding:7px 10px;font-size:12px;
  font-weight:600;color:#fff;border:0;cursor:pointer}
.lang option{color:#000}
.tabs{background:var(--navy-d);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs-i{display:flex;gap:2px;padding:0 18px;max-width:1440px;margin:0 auto}
.tab{padding:11px 15px;font-size:13.5px;font-weight:570;color:#A8C4E6;white-space:nowrap;
  border-bottom:3px solid transparent;transition:.14s;display:flex;align-items:center;gap:7px}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:var(--pb);font-weight:650}
.tab.lk{opacity:.45}
.tab .bdg{background:var(--bad);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;
  border-radius:9px;min-width:17px;text-align:center}
.view{padding:20px 22px 46px;max-width:1440px;margin:0 auto;width:100%}
@media(max-width:700px){.view{padding:14px}.top-r{padding:10px 14px}.tabs-i{padding:0 10px}}

/* ============================ BITS ============================ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.ch{padding:15px 18px 0;display:flex;align-items:flex-start;gap:12px}
.ct2{font-size:14.5px;font-weight:640;letter-spacing:-.015em;flex:1}
.cs{color:var(--mut);font-size:12px;margin-top:2px;font-weight:400;letter-spacing:0}
.cb{padding:14px 18px 18px}
.g{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:1.9fr 1fr}
.g12{grid-template-columns:1fr 1.9fr}
.mb{margin-bottom:14px}
@media(max-width:1150px){.g4{grid-template-columns:repeat(2,1fr)}
  .g3,.g21,.g12{grid-template-columns:1fr}}
@media(max-width:700px){.g2{grid-template-columns:1fr}.g4{grid-template-columns:1fr}}

.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  box-shadow:var(--sh)}
.kl{color:var(--mut);font-size:11px;font-weight:650;letter-spacing:.045em;text-transform:uppercase;
  display:flex;align-items:center;gap:6px}
.kv{font-size:25px;font-weight:690;letter-spacing:-.035em;margin-top:6px;line-height:1.12}
.kf{font-size:12px;color:var(--mut);margin-top:4px;display:flex;align-items:center;gap:6px;
  flex-wrap:wrap}
.up{color:var(--ok);font-weight:650}.dn{color:var(--bad);font-weight:650}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;
  font-size:11px;font-weight:650}
.p-g{background:var(--ok-l);color:#0C7E56}.p-r{background:var(--bad-l);color:#B02B2F}
.p-a{background:var(--warn-l);color:#A1640D}.p-b{background:var(--pb-l);color:#00729B}
.p-n{background:#EDF2F8;color:var(--ink-2)}

/* measured / guess tags */
.tg{display:inline-flex;align-items:center;gap:4px;padding:1.5px 7px;border-radius:5px;
  font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;flex:0 0 auto}
.tg-m{background:var(--pb-l);color:#00729B}
.tg-g{background:var(--warn-l);color:#A1640D}
.tg-s{background:#F0ECFD;color:#5436B8}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:620;color:var(--mut);font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;padding:0 10px 9px;border-bottom:1px solid var(--line);
  white-space:nowrap;position:sticky;top:0;background:#fff;z-index:1}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F8FBFD}
.r{text-align:right}.c{text-align:center}
.tw{overflow:auto;max-height:440px}
.nm{font-weight:580}.s2{color:var(--faint);font-size:11.5px}

/* action cards on Today */
.act{display:flex;gap:13px;padding:15px 17px;border-radius:var(--r);background:#fff;
  border:1px solid var(--line);border-left:3px solid var(--pb);box-shadow:var(--sh);
  margin-bottom:11px;align-items:flex-start}
.act.hi{border-left-color:var(--bad)}.act.md{border-left-color:var(--warn)}
.ai{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--pb-l);color:var(--pb-d)}
.act.hi .ai{background:var(--bad-l);color:var(--bad)}
.act.md .ai{background:var(--warn-l);color:var(--warn)}
.ab{flex:1;min-width:0}
.aw{font-size:19px;font-weight:700;letter-spacing:-.03em;margin-bottom:1px}
.at{font-weight:620;font-size:14px}
.ad{color:var(--ink-2);font-size:13px;margin-top:4px;line-height:1.5}
.arow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.aa{padding:7px 14px;border-radius:9px;background:var(--navy);color:#fff;font-size:12.5px;
  font-weight:600}
.aa:hover{background:var(--navy-2)}
.aa.b{background:var(--pb)}.aa.b:hover{background:var(--pb-d)}
.via{font-size:11px;color:var(--faint)}

.br{display:flex;align-items:center;gap:11px;margin-bottom:8px;font-size:13px}
.bl{width:150px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt2{flex:1;height:9px;background:var(--line-2);border-radius:6px;overflow:hidden}
.bf{height:100%;border-radius:6px;background:var(--pb);transition:width .5s}
.bv{width:94px;text-align:right;font-weight:620;flex:0 0 auto}

.seg{display:flex;gap:3px;background:#EAF0F7;padding:3px;border-radius:9px}
.seg button{padding:6px 14px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.note{background:var(--pb-l);border:1px solid #BDEBFB;border-radius:var(--r-s);padding:11px 14px;
  font-size:12.5px;color:#005E80;display:flex;gap:9px;align-items:flex-start;line-height:1.55}
.note.w{background:var(--warn-l);border-color:#F3DCB2;color:#8C5509}
.note.g{background:var(--ok-l);border-color:#BCE8D7;color:#0C7E56}
.hr{height:1px;background:var(--line-2);margin:15px 0}
.lockbox{text-align:center;padding:44px 26px;background:#fff;border:1.5px dashed #C9D7E6;
  border-radius:var(--r)}
.li{width:52px;height:52px;border-radius:15px;background:var(--warn-l);color:var(--warn);
  display:grid;place-items:center;margin:0 auto 14px}
.ul{list-style:none;padding:0;margin:14px auto 0;display:grid;gap:7px;max-width:400px;text-align:left}
.ul li{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--ink-2);padding:9px 12px;
  background:var(--bg);border-radius:8px}

/* ============================ TRACKER ============================ */
.tk{display:grid;grid-template-columns:1fr 330px;gap:14px}
@media(max-width:1000px){.tk{grid-template-columns:1fr}}
.chat{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  display:flex;flex-direction:column;min-height:600px}
.feed{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;
  max-height:66vh;min-height:430px}
.msg{max-width:min(88%,640px);animation:up .22s ease}
.msg.u{align-self:flex-end}
.mu{background:var(--navy);color:#fff;padding:10px 15px;border-radius:15px 15px 4px 15px;
  font-size:13.5px}
.ma{background:var(--bg);border:1px solid var(--line);border-radius:15px 15px 15px 4px;
  overflow:hidden}
.ans-n{padding:14px 16px 12px;background:#fff}
.ans-v{font-size:26px;font-weight:700;letter-spacing:-.035em;line-height:1.15}
.ans-sub{color:var(--mut);font-size:12.5px;margin-top:3px}
.ans-s{padding:11px 16px;border-top:1px solid var(--line-2)}
.ans-l{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.ans-t{font-size:13px;color:var(--ink-2);line-height:1.55}
.ans-act{padding:11px 16px;border-top:1px solid var(--line-2);background:var(--pb-ll)}
.ev{padding:9px 16px;border-top:1px solid var(--line-2);background:#FAFCFE}
.ev summary{font-size:11.5px;color:var(--mut);cursor:pointer;font-weight:600;list-style:none}
.ev summary::-webkit-details-marker{display:none}
.ev summary::before{content:"▸ ";color:var(--faint)}
.ev[open] summary::before{content:"▾ "}
.ev table{font-size:11.5px;margin-top:8px}
.ev td,.ev th{padding:4px 7px}
.bar{padding:13px 16px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center;
  background:#fff;border-radius:0 0 var(--r) var(--r)}
.bar input{flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:26px;
  font-size:13.5px;font-family:inherit;background:var(--bg)}
.bar input:focus{outline:0;border-color:var(--pb);background:#fff;box-shadow:0 0 0 3px #D6F2FC}
.mic{width:42px;height:42px;border-radius:50%;background:var(--pb);color:#fff;display:grid;
  place-items:center;flex:0 0 auto;transition:.15s}
.mic:hover{background:var(--pb-d)}
.mic.rec{background:var(--bad);animation:pulse 1.1s infinite}
.mic:disabled{background:#C3CEDE;cursor:not-allowed}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,57,62,.5)}50%{box-shadow:0 0 0 9px rgba(224,57,62,0)}}
.snd{width:42px;height:42px;border-radius:50%;background:var(--bg);color:var(--ink-2);
  display:grid;place-items:center;flex:0 0 auto;border:1.5px solid var(--line)}
.snd.on{background:var(--pb-l);color:var(--pb-d);border-color:var(--pb)}
.sug{display:flex;flex-direction:column;gap:7px}
.sg{text-align:left;padding:10px 13px;border:1px solid var(--line);border-radius:10px;
  background:#fff;font-size:12.5px;transition:.14s;line-height:1.4}
.sg:hover{border-color:var(--pb);background:var(--pb-ll)}
.typing{display:flex;gap:4px;padding:13px 16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);
  animation:bl 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

.mask{position:fixed;inset:0;z-index:70;background:rgba(0,27,77,.45);display:none;
  align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(2px)}
.mask.on{display:flex}
.modal{background:#fff;border-radius:18px;box-shadow:var(--sh-l);max-width:530px;width:100%;
  padding:25px 27px 21px;animation:up .2s;max-height:84vh;overflow-y:auto}
.mt{font-size:18px;font-weight:660;margin-bottom:9px;letter-spacing:-.02em}
.mb2{color:var(--ink-2);font-size:13.5px;line-height:1.65}
.mb2 p{margin:0 0 10px}.mb2 b{color:var(--ink)}
.mf{display:flex;justify-content:flex-end;gap:9px;margin-top:17px;padding-top:14px;
  border-top:1px solid var(--line-2)}
.tip{position:fixed;background:var(--navy-d);color:#fff;padding:7px 10px;border-radius:7px;
  font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:60;
  white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.tip.on{opacity:1}
.gl{stroke:var(--line);stroke-width:1}
.ax{font-size:10.5px;fill:var(--faint);font-variant-numeric:tabular-nums}
.hb{cursor:pointer}.hb:hover{opacity:.82}
.leg{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mut)}
.leg span{display:flex;align-items:center;gap:6px}
.sw2{width:11px;height:11px;border-radius:3px;flex:0 0 auto}

</style>
</head>
<body>
<div id="tip" class="tip"></div>

<!-- =============================== SETUP =============================== -->
<div id="setup">
  <div class="sw">
    <div class="logo">
      <div class="logo-m">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff"
             stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17l5-5 4 3 5-7 4 4"/></svg>
      </div>
      <div>
        <div class="logo-t">Tracker</div>
        <div class="logo-s">Merchant Growth AI</div>
      </div>
    </div>
    <div class="scard" id="scard"></div>
  </div>
</div>

<!-- ================================ APP ================================ -->
<div id="app">
  <header class="top">
    <div class="top-r">
      <div class="top-l">
        <div class="logo-m">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff"
               stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 17l5-5 4 3 5-7 4 4"/></svg>
        </div>
        <div class="top-n">Tracker</div>
      </div>
      <div class="mbox">
        <div>
          <div class="mname" id="mName">—</div>
          <div class="mmeta" id="mMeta">—</div>
        </div>
        <span class="tagb on" id="mTag">—</span>
        <button class="swbtn" onclick="switchMerchant()" id="swBtn">Switch</button>
        <select class="lang" id="langSel" onchange="setLang(this.value)">
          <option value="en">English</option>
          <option value="hi">हिंदी</option>
          <option value="te">తెలుగు</option>
          <option value="ta">தமிழ்</option>
        </select>
      </div>
    </div>
    <nav class="tabs"><div class="tabs-i" id="tabs"></div></nav>
  </header>

const C = { pb: "#00BAF2", navy: "#002970", navy2: "#013E8F", ok: "#17A673",

function niceMax(v) {
  if (v <= 0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v))), m = v / e;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * e;
}
function lineChart(o) {
  const W = o.w || 780, H = o.h || 230, ml = o.ml ?? 56, mr = o.mr ?? 12, mt = 10, mb = o.mb ?? 26;
  const iw = W - ml - mr, ih = H - mt - mb, all = [];
  o.series.forEach(s => s.data.forEach(v => v != null && all.push(v)));
  (o.band || []).forEach(b => { all.push(b[0]); all.push(b[1]); });
  const max = o.max ?? niceMax(Math.max(...all) * 1.05);
  const min = o.min ?? (Math.min(...all) < 0 ? -niceMax(-Math.min(...all)) : 0);
  const n = o.series[0].data.length;
  const X = i => ml + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
  const Y = v => mt + ih - ((v - min) / (max - min || 1)) * ih;
  let g = "", ticks = o.ticks ?? 4;
  for (let k = 0; k <= ticks; k++) {
    const v = min + (k / ticks) * (max - min), y = Y(v);
    g += `<line class="gl" x1="${ml}" y1="${y}" x2="${W - mr}" y2="${y}"/>
      <text class="ax" x="${ml - 8}" y="${y + 3.5}" text-anchor="end">${o.yFmt ? o.yFmt(v) : nf(v)}</text>`;
  }
  let band = "";
  if (o.band) {
    const up = o.band.map((b, i) => `${X(i)},${Y(b[1])}`).join(" ");
    const dn = o.band.map((b, i) => `${X(i)},${Y(b[0])}`).reverse().join(" ");
    band = `<polygon points="${up} ${dn}" fill="${o.bandColor || C.pb}" opacity=".15"/>`;
  }
  let p = "";
  o.series.forEach(s => {
    const pts = []; s.data.forEach((v, i) => { if (v != null) pts.push([X(i), Y(v)]); });
    if (!pts.length) return;
    const d = pts.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" ");
    if (s.fill) p += `<path d="${d} L ${pts[pts.length - 1][0]} ${Y(min)} L ${pts[0][0]} ${Y(min)} Z"
      fill="${s.color}" opacity="${s.fillOp || .11}"/>`;
    p += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2.2}"
      stroke-linejoin="round" stroke-linecap="round"${s.dash ? ` stroke-dasharray="${s.dash}"` : ""}/>`;
  });
  let mk = "";
  (o.marks || []).forEach(m => {
    const x = X(m.i);
    mk += `<line x1="${x}" y1="${mt}" x2="${x}" y2="${mt + ih}" stroke="${m.color || C.warn}"
      stroke-width="1.2" stroke-dasharray="3 3" opacity=".8"/>`;
    if (m.label) mk += `<text class="ax" x="${x}" y="${mt - 1}" text-anchor="middle"
      fill="${m.color || C.warn}" font-weight="650">${esc(m.label)}</text>`;
  });
  let xl = "", step = o.xStep || Math.max(1, Math.ceil(n / (o.xCount || 7)));
  for (let i = 0; i < n; i += step)
    xl += `<text class="ax" x="${X(i)}" y="${H - 7}" text-anchor="middle">${esc(o.labels[i] ?? "")}</text>`;
  if (o.lastLabel && n > 1)
    xl += `<text class="ax" x="${X(n - 1)}" y="${H - 7}" text-anchor="end">${esc(o.labels[n - 1])}</text>`;
  let hot = "";
  if (o.hover) {
    const bw = iw / Math.max(n - 1, 1);
    for (let i = 0; i < n; i++)
      hot += `<rect x="${X(i) - bw / 2}" y="${mt}" width="${bw}" height="${ih}" fill="transparent"
        onmousemove='tipOn(event,${JSON.stringify(o.hover(i)).replace(/'/g, "&apos;")})'
        onmouseleave="tipOff()"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}${band}${p}${mk}${xl}${hot}</svg>`;
}
function barChart(o) {
  const W = o.w || 780, H = o.h || 210, ml = o.ml ?? 56, mr = 12, mt = 14, mb = 28;
  const iw = W - ml - mr, ih = H - mt - mb, n = o.data.length;
  const max = o.max ?? niceMax(Math.max(...o.data, 0) * 1.06);
  const mn = Math.min(0, ...o.data), lo = mn < 0 ? -niceMax(-mn) : 0;
  const Y = v => mt + ih - ((v - lo) / (max - lo || 1)) * ih;
  const bw = (iw / n) * (o.thick || .62), gap = iw / n;

    const v = lo + (k / 4) * (max - lo), y = Y(v);
    g += `<line class="gl" x1="${ml}" y1="${y}" x2="${W - mr}" y2="${y}"/>
      <text class="ax" x="${ml - 8}" y="${y + 3.5}" text-anchor="end">${o.yFmt ? o.yFmt(v) : nf(v)}</text>`;
  }
  let b = "";
  o.data.forEach((v, i) => {

    if (o.valFmt) b += `<text class="ax" x="${x + bw / 2}" y="${y - 5}" text-anchor="middle"

    if (!o.xStep || i % o.xStep === 0)

}

function gauge(o) {

function heatMap(o) {

      s += `<rect class="hb" x="${46 + ci * cw}" y="${ri * ch + 3}" width="${cw - 2.5}"

function spark(data, color = C.pb, w = 92, h = 26) {

  return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;height:${h}px">

  if (tracked()) {

    return (1 - sum(dl.map(x => x.cogs)) / sum(dl.map(x => x.revenue))) * 100;
  }
  return d.totals.declared_margin;
}

<script>
/* ==================================================================
   Tracker — shell and all screens except Tracker itself
   ================================================================== */
const TABS = [
  ["today", "today", "home"], ["txn", "txn", "list"], ["trends", "trends", "trend"],
  ["low", "low", "down"], ["avg", "avg", "avg"], ["prod", "prod", "box"],
  ["share", "share", "pie"], ["credit", "credit", "cash"], ["tracker", "tracker", "chat"],
];
const SUBT = {
  today: "What changed, what it costs you, and what to do",

};

function shell() {

  document.getElementById("mMeta").textContent =
    `${S.setup.sub || m.category} · ${m.city}`;

      onclick="go('${k}')">${ic(lock ? "lock" : icon, 15)}<span>${t(key)}</span>

}

    prod: k === "prodlock" ? vProdLock : vProd, share: vShare, credit: vCredit,

/* ===================== shared figures ===================== */
function F() {
  const d = D(), dl = daily(), n = dl.length;
  const last = dl[n - 1], prev = dl[n - 2];
  const r30 = sum(dl.slice(-30).map(x => x.revenue));
  const r30p = sum(dl.slice(-60, -30).map(x => x.revenue));
  const t30 = sum(dl.slice(-30).map(txOf)), t30p = sum(dl.slice(-60, -30).map(txOf));
  const mg = marginPct() / 100;
  const wd = d.weekday, wdMean = mean(wd.map(x => x.revenue));
  const worst = wd.slice().sort((a, b) => a.revenue - b.revenue)[0];
  const best = wd.slice().sort((a, b) => b.revenue - a.revenue)[0];
  const hr = d.hourly.slice().sort((a, b) => b.revenue - a.revenue);
  const wk = d.weekly || [];
  const full = d.monthly.filter(m => (m.days || 30) >= 25);
  return { d, dl, n, last, prev, r30, r30p,
    g30: r30p ? (r30 / r30p - 1) * 100 : 0, t30, t30p,
    tg30: t30p ? (t30 / t30p - 1) * 100 : 0,
    atv30: t30 ? r30 / t30 : 0, atv30p: t30p ? r30p / t30p : 0,
    mg, gp30: r30 * mg, fixed: d.fixed_monthly, net30: r30 * mg - d.fixed_monthly,
    wd, wdMean, worst, best, hr, wk, full,
    dayAvg: r30 / 30 };
}

/* ============ opportunities, ranked by rupees at stake ============
   A loss is money leaving now. An upside is money that was never yours.
   They are never added together, because that would flatter the number. */
function opps() {
  const f = F(), d = f.d, sh = SHARE(), out = [];
  const push = o => out.push(o);

  // --- losses -------------------------------------------------------
  const gap = f.wdMean - f.worst.revenue;
  push({ kind: "loss", worth: gap * 0.5 * 52, annual: gap * 0.5 * 52, per: "a year", sev: "md", icon: "down",
    title: `${WDFULL[f.worst.wd]} is your weakest day`, tag: "m",
    body: `${WDFULL[f.worst.wd]} brings in ${inrF(f.worst.revenue)} against ${inrF(f.wdMean)} on a normal day — ${Math.abs(f.worst.vs_avg).toFixed(0)}% down. Recovering half that gap is worth ${inr(gap * 0.5 * 52)} a year.`,
    act: "Send a deal to nearby customers", via: "Paytm Ads / Deals", tab: "low" });

  if (sh) push({ kind: "loss", worth: sh.switchers.annual_loss, annual: sh.switchers.annual_loss,
    per: "a year", sev: "hi", icon: "pie",
    title: `${sh.switchers.count} regulars started buying from quick commerce`, tag: "s",
    body: `They still come to you, but their basket fell from ${inrF(sh.switchers.basket_before)} to ${inrF(sh.switchers.basket_after)}. That is ${inr(sh.switchers.monthly_loss)} a month leaving the shop.`,
    act: "See what they moved", via: "Your Share", tab: "share" });

  const c = d.customers;
  if (c.winback && c.winback.length) push({ kind: "loss", worth: c.at_risk, annual: c.at_risk * 4, per: "over 3 months",
    sev: "md", icon: "users", title: `${c.winback.length} regulars have gone quiet`, tag: "m",
    body: `Together worth about ${inr(c.at_risk)} over the next three months. The top one came ${c.winback[0].visits} times and has not been back for ${c.winback[0].recency} days.`,
    act: "Send a cashback offer", via: "Paytm Cashback", tab: "share" });

  if (tracked()) {
    if ((d.stockout || []).length) {
      const so = d.stockout, lost = sum(so.map(x => x.d7 * x.cost * 1.12));
      push({ kind: "loss", worth: lost, annual: lost * 12, per: "at risk this week",
        sev: "hi", icon: "box",
        title: `${so.length} items run out within 2 days`, tag: "m",
        body: `${so[0].name} has ${so[0].on_hand} left against ${nf(so[0].d7, 0)} forecast for the week. Lead time is ${so[0].lead} day${so[0].lead === 1 ? "" : "s"} — order today or lose the sales.`,
        act: "See the reorder list", via: "Products", tab: "prod" });
    }
    if (d.totals.dead_capital > 0) push({ kind: "loss", worth: d.totals.dead_capital,
      annual: d.totals.dead_capital, per: "stuck right now", sev: "md", icon: "alert",
      title: `${d.dead_stock.length} items are sitting dead on the shelf`, tag: "m",
      body: `Nothing has sold from them in three weeks or more. The worst is ${d.dead_stock[0].name} — ${d.dead_stock[0].on_hand} units, nothing sold for ${d.dead_stock[0].days_since_sale} days.`,
      act: "Bundle it with a fast mover", via: "Paytm Deals", tab: "prod" });
  }

  const cf = d.cashflow, short = cf.peak_stock_need - Math.max(cf.net30, 0);
  if (short > 0) push({ kind: "loss", worth: short, annual: short, per: "shortfall",
    sev: "hi", icon: "cash",
    title: "You will be short of stock money", tag: "m",
    body: `Your heaviest 10-day window (${cf.peak_window_start} to ${cf.peak_window_end}) needs about ${inr(cf.peak_stock_need)}. Projected free cash is ${inr(Math.max(cf.net30, 0))}.`,
    act: `Pre-approved ${inr(d.credit.limit)}`, via: "Paytm Business Loan", tab: "credit" });

  // --- upside -------------------------------------------------------
  if (sh) push({ kind: "upside", worth: sh.cluster.worth * 12, annual: sh.cluster.worth * 12,
    per: "a year if you win them",
    sev: "lo", icon: "users",
    title: `${nf(sh.cluster.users)} people ${sh.cluster.dist} away have never paid you`, tag: "s",
    body: `A cluster ${sh.cluster.direction} walks past you to reach the market. They spend about ${inrF(sh.cluster.spend)} a month on what you sell, so winning even a tenth of them is ${inr(sh.cluster.worth)} a month.`,
    act: "Advertise to this pincode", via: "Paytm Ads", tab: "share" });

  if (sh && sh.adjacent_total) push({ kind: "upside", worth: sh.adjacent_total * 12,
    annual: sh.adjacent_total * 12, per: "a year if you stock it", sev: "lo", icon: "star",
    title: "Your customers buy things nearby that you do not stock", tag: "s",
    body: `${inr(sh.adjacent_total)} a month is spent by people already walking into your shop, on categories you do not keep.`,
    act: "See what they buy", via: "Your Share", tab: "share" });

  // Ranked on an annual equivalent so a weekly exposure and a yearly leak can be
  // compared honestly. Each card still shows its own natural period.
  const L = out.filter(o => o.kind === "loss").sort((a, b) => b.annual - a.annual);
  const U = out.filter(o => o.kind === "upside").sort((a, b) => b.annual - a.annual);
  const r = L.concat(U);
  r.losses = L; r.upsides = U;
  r.lossTotal = sum(L.map(o => o.annual));
  return r;
}

  ${O.map((o, i) => `

function head() { return ""; }

/* ========================= TRANSACTIONS ========================== */
function vTxn() {
  const f = F(), d = f.d;

  if (S.win === "day") {
    const w = f.dl.slice(-60);
    labels = w.map((_, i) => dShort(dateAt(f.n - 60 + i)));
    rev = w.map(x => x.revenue); cogs = w.map(x => x.cogs || 0);
    tx = w.map(txOf); unit = "day";
  } else if (S.win === "week") {
    const w = f.wk.slice(-26);
    labels = w.map(x => dShort(new Date(x.w + "T00:00:00")));
    rev = w.map(x => x.revenue); cogs = w.map(x => x.cogs || 0);
    tx = w.map(x => x.bills); unit = "week";
  } else {
    const w = d.monthly;
    labels = w.map(x => ymL(x.ym));
    rev = w.map(x => x.revenue); cogs = w.map(x => x.cogs || 0);
    tx = w.map(x => x.bills || x.txns); unit = "month";
  }
  const prof = rev.map((v, i) => tracked() ? v - cogs[i] : v * f.mg);
  const mavg = mean(rev);

  return `<div class="g g4 mb">
    ${kpi("Last 30 days", inr(f.r30), `<span class="${f.g30 >= 0 ? "up" : "dn"}">${pc(f.g30)}</span> vs previous 30`, "m")}
    ${kpi(tracked() ? "Gross profit · 30d" : "Estimated profit · 30d", inr(f.gp30),
      `${f.mg * 100 >= 0 ? (f.mg * 100).toFixed(1) : "—"}% margin`, tracked() ? "m" : "g")}
    ${kpi(tracked() ? "Bills · 30d" : "Payments · 30d", nf(f.t30),
      `<span class="${f.tg30 >= 0 ? "up" : "dn"}">${pc(f.tg30)}</span> vs previous 30`, "m")}
    ${kpi("Average sale", inrF(f.atv30),
      `<span class="${f.atv30 >= f.atv30p ? "up" : "dn"}">${pc((f.atv30 / f.atv30p - 1) * 100)}</span> vs previous 30`, "m")}
  </div>

  <div class="card mb"><div class="ch"><div class="ct2">Money received
    <div class="cs">Every figure here is added up straight from the payment records. Nothing is modelled.</div></div>
    <div class="seg">${[["day", t("day")], ["week", t("week")], ["month", t("month")]]
      .map(([k, l]) => `<button class="${S.win === k ? "on" : ""}" onclick="S.win='${k}';go('txn')">${l}</button>`).join("")}</div>
    </div><div class="cb">
    ${S.win === "day"
      ? lineChart({ series: [{ data: rev, color: "#A9DCF2", w: 1.3 },
                             { data: movAvg(rev, 7), color: C.pb, w: 2.6, fill: true }],
          labels, h: 250, yFmt: v => inr(v, 0), xCount: 8, lastLabel: true,
          hover: i => `<b>${labels[i]}</b><br>${inrF(rev[i])}<br>${nf(tx[i])} ${tracked() ? "bills" : "payments"}<br>7-${unit} average ${inrF(movAvg(rev, 7)[i])}` })
      : barChart({ data: rev, labels, h: 250, yFmt: v => inr(v, 0), thick: .6,
          xStep: S.win === "week" ? 2 : 1,
          colorFn: (v, i) => i === rev.length - 1 ? "#9FB6D4" : v < mavg * .88 ? C.warn : C.pb,
          hover: i => `<b>${labels[i]}</b><br>${inrF(rev[i])}<br>${nf(tx[i])} ${tracked() ? "bills" : "payments"}<br>${pc((rev[i] / mavg - 1) * 100)} vs the average ${unit}` })}
    <div class="leg"><span><i class="sw2" style="background:${C.pb}"></i>Money received</span>
      ${S.win !== "day" ? `<span><i class="sw2" style="background:${C.warn}"></i>Below your average ${unit}</span>` : `<span><i class="sw2" style="background:${C.pb}"></i>7-day average (the real trend)</span>`}
      <span style="color:var(--faint)">last ${unit} is still running</span></div>
    </div></div>

  <div class="card"><div class="ch"><div class="ct2">
    ${tracked() ? "What you kept" : "What you probably kept"} ${TAG[tracked() ? "m" : "g"]()}
    <div class="cs">${tracked()
      ? "Money received minus what the goods cost you. Both figures come from your bills."
      : `No cost data for this shop, so Tracker applies the ${f.mg * 100}% margin for a ${esc(S.setup.sub || "shop")} and labels it a guess. It will never show this as fact.`}</div></div></div>
    <div class="cb">${lineChart({
      series: [{ data: rev, color: C.navy, w: 2 }, { data: prof, color: C.ok, w: 2.4, fill: true }],
      labels, h: 210, yFmt: v => inr(v, 0), xCount: 8, lastLabel: true,
      hover: i => `<b>${labels[i]}</b><br>Received ${inrF(rev[i])}<br>Kept ${inrF(prof[i])}<br>${(prof[i] / rev[i] * 100).toFixed(1)}% margin` })}
    <div class="leg"><span><i class="sw2" style="background:${C.navy}"></i>Money received</span>
      <span><i class="sw2" style="background:${C.ok}"></i>${tracked() ? "Kept after cost of goods" : "Estimated keep"}</span></div>
    </div></div>`;
}
function kpi(l, v, f2, tag, col) {
  return `<div class="kpi"><div class="kl">${l}${tag ? " " + TAG[tag]() : ""}</div>
    <div class="kv num" ${col ? `style="color:${col}"` : ""}>${v}</div>
    <div class="kf">${f2}</div></div>`;
}

/* ============================ TRENDS ============================= */
function vTrends() {
  const f = F(), d = f.d;
  const wd = f.wd, wmax = Math.max(...wd.map(x => x.revenue));
  const hr = d.hourly, hmax = Math.max(...hr.map(x => x.revenue));
  const top3 = hr.slice().sort((a, b) => b.share - a.share).slice(0, 3);
  const mo = f.full;
  return `<div class="g g4 mb">
    ${kpi("Growth · 30d vs 30d", pc(f.g30), f.g30 >= 0 ? "getting better" : "getting worse", "m",
      f.g30 >= 0 ? C.ok : C.bad)}
    ${kpi("Best day", WDFULL[f.best.wd], `${inrF(f.best.revenue)} on average`, "m")}
    ${kpi("Busiest hour", top3[0].h + ":00", `${top3[0].share.toFixed(1)}% of a day's money`, "m")}
    ${kpi("Busiest 3 hours", sum(top3.map(x => x.share)).toFixed(0) + "%", "of everything you take", "m")}
  </div>

  <div class="g g2 mb">
    <div class="card"><div class="ch"><div class="ct2">Day of the week ${TAG.m()}
      <div class="cs">Average across the year. Green is your best, red your worst.</div></div></div>
      <div class="cb">${barChart({ data: wd.map(x => x.revenue), labels: wd.map(x => x.name),
        h: 205, yFmt: v => inr(v, 0),
        colorFn: v => v === wmax ? C.ok : v === Math.min(...wd.map(x => x.revenue)) ? C.bad : C.pb,
        hover: i => `<b>${WDFULL[wd[i].wd]}</b><br>${inrF(wd[i].revenue)} average<br>${pc(wd[i].vs_avg)} vs your other days` })}
      <div class="note" style="margin-top:4px">${ic("info", 15)}<div>
        The gap between ${WDFULL[f.best.wd]} and ${WDFULL[f.worst.wd]} is
        <b>${inrF(f.best.revenue - f.worst.revenue)} every week</b> —
        ${inr((f.best.revenue - f.worst.revenue) * 52)} a year.</div></div></div></div>

    <div class="card"><div class="ch"><div class="ct2">Hour of the day ${TAG.m()}
      <div class="cs">Where your staff and your stock actually need to be.</div></div></div>
      <div class="cb">${barChart({ data: hr.map(x => x.revenue), labels: hr.map(x => x.h),
        h: 205, yFmt: v => inr(v, 0), thick: .72,
        colorFn: v => v === hmax ? C.navy : C.pb,
        hover: i => `<b>${hr[i].h}:00 – ${hr[i].h + 1}:00</b><br>${inrF(hr[i].revenue)}<br>${hr[i].share.toFixed(1)}% of all your money` })}
      <div class="note" style="margin-top:4px">${ic("clock", 15)}<div>
        ${top3.map(x => x.h + ":00").join(", ")} carry
        <b>${sum(top3.map(x => x.share)).toFixed(0)}%</b> of the day. Running out of stock or short of
        help in those hours costs more than at any other time.</div></div></div></div>
  </div>

  <div class="card mb"><div class="ch"><div class="ct2">Week × hour ${TAG.m()}
    <div class="cs">Darker means busier. The dark blocks are the only hours worth optimising.</div></div></div>
    <div class="cb">${heatMap({ matrix: d.heatmap, rows: WDN, cols: d.heatmap_hours })}</div></div>

  <div class="card"><div class="ch"><div class="ct2">Month by month ${TAG.m()}
    <div class="cs">Part months are excluded so you are never comparing 13 days against 31.</div></div></div>
    <div class="cb">${barChart({ data: mo.map(m => m.revenue), labels: mo.map(m => ymL(m.ym)),
      h: 200, yFmt: v => inr(v, 0), thick: .58,
      colorFn: v => v === Math.max(...mo.map(m => m.revenue)) ? C.ok
        : v === Math.min(...mo.map(m => m.revenue)) ? C.warn : C.pb,
      hover: i => `<b>${ymFull(mo[i].ym)}</b><br>${inrF(mo[i].revenue)}<br>${nf(mo[i].bills || mo[i].txns)} ${tracked() ? "bills" : "payments"} over ${mo[i].days} days` })}
    </div></div>`;
}

/* ========================= LOW EARNINGS ========================== */
/* The decomposition: earnings = how many people came x how much each spent. */
function vLow() {
  const f = F(), d = f.d;
  const wd = f.wd.slice().sort((a, b) => a.revenue - b.revenue);
  const w = f.wk.slice(-5, -1);               // last 4 complete weeks
  const wAll = f.wk.slice(-13, -1);
  const worstWk = w.slice().sort((a, b) => a.revenue - b.revenue)[0];
  const bestWk = w.slice().sort((a, b) => b.revenue - a.revenue)[0];
  const wkMean = mean(wAll.map(x => x.revenue));

  // decompose the worst week against the 12-week norm
  const nTx = mean(wAll.map(x => x.bills)), nAtv = wkMean / nTx;
  const wTx = worstWk.bills, wAtv = worstWk.revenue / worstWk.bills;
  const dTx = (wTx / nTx - 1) * 100, dAtv = (wAtv / nAtv - 1) * 100;
  const verdict = Math.abs(dTx) > Math.abs(dAtv) * 1.6 ? "footfall"
    : Math.abs(dAtv) > Math.abs(dTx) * 1.6 ? "basket" : "both";
  const VER = {
    footfall: { t: "Fewer people came", c: C.bad,
      d: "Your basket size held up. The shortfall is almost entirely people who did not walk in.",
      fix: "This is a footfall problem. An offer, a sign, or checking whether something changed on your street. Discounting your existing customers will not fix it — they already came." },
    basket: { t: "The same people spent less", c: C.warn,
      d: "Roughly the usual number of customers came, but each one spent less than normal.",
      fix: "This is a basket problem. Most often it means you were out of stock on something people came for, or a high-value line stopped moving. Check the Products screen first." },
    both: { t: "Both moved against you", c: C.bad,
      d: "Fewer customers, and the ones who came spent less. These usually have different causes.",
      fix: "Treat footfall first — it is the larger of the two and the easier to influence." },
  }[verdict];

  return `<div class="note mb">${ic("info", 16)}<div>
    <b>Knowing which day was worst is not useful on its own — you already feel that.</b>
    What matters is <i>why</i>. Every rupee you take is
    <b>how many people came × how much each one spent</b>. When earnings fall, exactly one of
    those two usually moved. They need completely different fixes.</div></div>

  <div class="card mb"><div class="ch"><div class="ct2">Your worst recent week, taken apart ${TAG.m()}
    <div class="cs">Week of ${dLong(new Date(worstWk.w + "T00:00:00"))}, measured against your last 12 weeks.</div></div></div>
    <div class="cb">
      <div class="g g3" style="gap:12px;margin-bottom:16px">
        <div style="padding:14px 16px;background:var(--bg);border-radius:var(--r-s)">
          <div class="kl" style="font-size:10.5px">That week</div>
          <div class="num" style="font-size:23px;font-weight:700;margin-top:4px">${inrF(worstWk.revenue)}</div>
          <div class="s2">${pc((worstWk.revenue / wkMean - 1) * 100)} vs your normal week</div></div>
        <div style="padding:14px 16px;background:${Math.abs(dTx) > 3 ? "var(--bad-l)" : "var(--bg)"};
          border-radius:var(--r-s)">
          <div class="kl" style="font-size:10.5px">People who came</div>
          <div class="num" style="font-size:23px;font-weight:700;margin-top:4px;
            color:${dTx < -3 ? C.bad : "inherit"}">${pc(dTx)}</div>
          <div class="s2">${nf(wTx)} vs ${nf(nTx, 0)} normally</div></div>
        <div style="padding:14px 16px;background:${Math.abs(dAtv) > 3 ? "var(--warn-l)" : "var(--bg)"};
          border-radius:var(--r-s)">
          <div class="kl" style="font-size:10.5px">Spend per person</div>
          <div class="num" style="font-size:23px;font-weight:700;margin-top:4px;
            color:${dAtv < -3 ? C.warn : "inherit"}">${pc(dAtv)}</div>
          <div class="s2">${inrF(wAtv)} vs ${inrF(nAtv)} normally</div></div>
      </div>
      <div style="padding:15px 17px;border-radius:var(--r-s);background:#fff;
        border:1px solid var(--line);border-left:3px solid ${VER.c}">
        <div style="font-weight:660;font-size:15px;color:${VER.c}">${VER.t}</div>
        <div style="color:var(--ink-2);font-size:13px;margin-top:5px;line-height:1.55">${VER.d}</div>
        <div class="hr" style="margin:12px 0"></div>
        <div class="kl" style="font-size:10px;margin-bottom:4px">${t("doit")}</div>
        <div style="font-size:13px;color:var(--ink-2);line-height:1.55">${VER.fix}</div>
      </div>
    </div></div>

  <div class="g g2 mb">
    <div class="card"><div class="ch"><div class="ct2">Days ranked, worst first ${TAG.m()}
      <div class="cs">Average across the whole year.</div></div></div>
      <div class="cb"><div class="tw"><table>
        <thead><tr><th>Day</th><th class="r">Average</th><th class="r">vs normal</th>
          <th class="r">Costing you</th></tr></thead>
        <tbody>${wd.map((x, i) => `<tr>
          <td class="nm">${WDFULL[x.wd]}${i === 0 ? ` <span class="pill p-r">worst</span>` : ""}</td>
          <td class="r num">${inrF(x.revenue)}</td>
          <td class="r num ${x.vs_avg >= 0 ? "up" : "dn"}">${pc(x.vs_avg)}</td>
          <td class="r num">${x.revenue < f.wdMean ? inr((f.wdMean - x.revenue) * 52) + " / yr" : "—"}</td>
        </tr>`).join("")}</tbody></table></div></div></div>

    <div class="card"><div class="ch"><div class="ct2">Last four complete weeks ${TAG.m()}
      <div class="cs">Which week was weakest, and whether it was people or basket.</div></div></div>
      <div class="cb">${barChart({ data: w.map(x => x.revenue),
        labels: w.map(x => dShort(new Date(x.w + "T00:00:00"))), h: 180, yFmt: v => inr(v, 0),
        thick: .5, colorFn: v => v === worstWk.revenue ? C.bad : v === bestWk.revenue ? C.ok : C.pb,
        hover: i => `<b>Week of ${dShort(new Date(w[i].w + "T00:00:00"))}</b><br>${inrF(w[i].revenue)}<br>${nf(w[i].bills)} ${tracked() ? "bills" : "payments"}<br>${inrF(w[i].revenue / w[i].bills)} each` })}
        <div class="hr"></div>
        ${w.map(x => {
          const tx = (x.bills / nTx - 1) * 100, av = (x.revenue / x.bills / nAtv - 1) * 100;
          const why = Math.abs(tx) > Math.abs(av) * 1.6 ? "fewer people"
            : Math.abs(av) > Math.abs(tx) * 1.6 ? "smaller baskets" : "both";
          return `<div style="display:flex;gap:10px;align-items:center;font-size:12.5px;padding:6px 0;
            border-bottom:1px solid var(--line-2)">
            <span style="flex:1">Week of ${dShort(new Date(x.w + "T00:00:00"))}</span>
            <span class="num s2" style="width:62px;text-align:right">${pc(tx, 0)} people</span>
            <span class="num s2" style="width:66px;text-align:right">${pc(av, 0)} basket</span>
            <span class="pill ${x.revenue < wkMean ? "p-a" : "p-g"}" style="width:104px;justify-content:center">
              ${x.revenue < wkMean ? why : "above normal"}</span></div>`;
        }).join("")}
      </div></div>
  </div>

  <div class="card"><div class="ch"><div class="ct2">Days that broke the pattern ${TAG.m()}
    <div class="cs">Days too far from the expected level to be ordinary noise.</div></div></div>
    <div class="cb"><div class="tw"><table>
      <thead><tr><th>Date</th><th class="r">Actual</th><th class="r">Expected</th>
        <th class="r">Gap</th><th>Likely reason</th></tr></thead>
      <tbody>${(d.anomalies || []).slice(0, 12).map(a => {
        const dt = new Date(a.d + "T00:00:00");
        return `<tr><td class="nm">${dShort(dt)} ${dt.getFullYear()}
          <div class="s2">${WDFULL[(dt.getDay() + 6) % 7]}</div></td>
          <td class="r num">${inrF(a.actual)}</td><td class="r num s2">${inrF(a.expected)}</td>
          <td class="r num ${a.kind === "spike" ? "up" : "dn"}">${pc((a.actual / a.expected - 1) * 100, 0)}</td>
          <td>${a.festival ? `<span class="pill p-a">${esc(a.festival)}</span> ${TAG.m()}`
            : `<span class="pill ${a.kind === "spike" ? "p-g" : "p-r"}">unexplained ${a.kind}</span> ${TAG.g()}`}</td></tr>`;
      }).join("")}</tbody></table></div>
      <div class="note w" style="margin-top:12px">${ic("info", 15)}<div>
        A festival is a <b>measured</b> explanation — the date is known.
        An unexplained spike or dip is tagged a <b>guess</b>, because Tracker can see that something
        happened but has no idea what. It will not invent a reason.</div></div>
    </div></div>`;
}

/* ============================ AVERAGES =========================== */
function vAvg() {
  const f = F(), d = f.d;
  const dl = f.dl, full = f.full;
  const openDays = dl.filter(x => x.revenue > 0);
  const avgDay = mean(openDays.map(x => x.revenue));
  const avgWk = mean(f.wk.slice(0, -1).map(x => x.revenue));
  const avgMo = mean(full.map(x => x.revenue));
  const avgTx = mean(openDays.map(txOf));
  const atv = avgDay / avgTx;
  const r90 = mean(dl.slice(-90).map(x => x.revenue));
  const r90p = mean(dl.slice(-180, -90).map(x => x.revenue));
  const bands = [
    ["A really good day", dl.map(x => x.revenue).sort((a, b) => b - a)[Math.floor(dl.length * .1)], C.ok],
    ["A normal day", avgDay, C.pb],
    ["A slow day", dl.map(x => x.revenue).sort((a, b) => a - b)[Math.floor(dl.length * .1)], C.warn],
  ];
  return `<div class="note mb">${ic("info", 16)}<div>
    These are your <b>normals</b>. On their own they are boring — their job is to let you tell
    a bad day apart from a bad trend. One day below average means nothing. Five in a row means
    something.</div></div>

  <div class="g g4 mb">
    ${kpi("A normal day", inrF(avgDay), `${nf(avgTx, 0)} ${tracked() ? "bills" : "payments"}`, "m")}
    ${kpi("A normal week", inr(avgWk), `${nf(avgTx * 7, 0)} ${tracked() ? "bills" : "payments"}`, "m")}
    ${kpi("A normal month", inr(avgMo), `over ${full.length} complete months`, "m")}
    ${kpi("A normal sale", inrF(atv), tracked() ? `${(d.totals.units / d.totals.bills).toFixed(1)} items a bill` : "per payment", "m")}
  </div>

  <div class="g g2 mb">
    <div class="card"><div class="ch"><div class="ct2">What counts as good, normal and slow ${TAG.m()}
      <div class="cs">Your own top and bottom 10% of days, not someone else's benchmark.</div></div></div>
      <div class="cb">${hBars({ rows: bands.map(([l, v, c]) => ({ label: l, v, color: c })), fmt: inrF })}
      <div class="hr"></div>
      <div style="font-size:12.5px;color:var(--ink-2);line-height:1.6">
        Anything under <b>${inrF(bands[2][1])}</b> is a genuinely slow day for you — it happens
        about ${nf(dl.filter(x => x.revenue < bands[2][1]).length)} days a year.
        Anything over <b>${inrF(bands[0][1])}</b> is a strong one.</div>
      </div></div>

    <div class="card"><div class="ch"><div class="ct2">Is the normal itself moving? ${TAG.m()}
      <div class="cs">An average is only useful if you know which way it is drifting.</div></div></div>
      <div class="cb">
        <div style="display:flex;gap:16px;align-items:baseline;flex-wrap:wrap">
          <div><div class="kl" style="font-size:10.5px">Last 90 days</div>
            <div class="num" style="font-size:26px;font-weight:700">${inrF(r90)}</div>
            <div class="s2">a day</div></div>
          <div style="font-size:21px;color:var(--faint)">→</div>
          <div><div class="kl" style="font-size:10.5px">90 days before that</div>
            <div class="num" style="font-size:26px;font-weight:700;color:var(--mut)">${inrF(r90p)}</div>
            <div class="s2">a day</div></div>
          <div style="margin-left:auto">
            <span class="pill ${r90 >= r90p ? "p-g" : "p-r"}" style="font-size:14px;padding:5px 13px">
              ${pc((r90 / r90p - 1) * 100)}</span></div>
        </div>
        <div class="hr"></div>
        ${lineChart({ series: [{ data: movAvg(dl.map(x => x.revenue), 30), color: C.pb, w: 2.6, fill: true }],
          labels: dl.map((_, i) => dShort(dateAt(i))), h: 150, yFmt: v => inr(v, 0), xCount: 6, ticks: 3,
          hover: i => `<b>${dShort(dateAt(i))}</b><br>30-day average ${inrF(movAvg(dl.map(x => x.revenue), 30)[i])}` })}
        <div class="s2" style="margin-top:4px">30-day rolling average — the line that actually
          tells you whether the shop is growing.</div>
      </div></div>
  </div>

  <div class="card"><div class="ch"><div class="ct2">Normal, broken down ${TAG.m()}</div></div>
    <div class="cb"><div class="tw"><table>
      <thead><tr><th>Period</th><th class="r">Money</th><th class="r">${tracked() ? "Bills" : "Payments"}</th>
        <th class="r">Per sale</th><th class="r">${tracked() ? "Kept" : "Kept (est.)"}</th></tr></thead>
      <tbody>
        ${[["A normal day", avgDay, avgTx], ["A normal week", avgWk, avgTx * 7],
           ["A normal month", avgMo, avgTx * 30.4], ["A whole year", avgMo * 12, avgTx * 365]]
          .map(([l, v, tx]) => `<tr><td class="nm">${l}</td>
            <td class="r num">${inrF(v)}</td><td class="r num">${nf(tx, 0)}</td>
            <td class="r num">${inrF(v / tx)}</td>
            <td class="r num" style="color:${C.ok};font-weight:620">${inrF(v * f.mg)}</td></tr>`).join("")}
      </tbody></table></div>
      ${!tracked() ? `<div class="note w" style="margin-top:11px">${ic("info", 15)}<div>
        The "kept" column uses the ${(f.mg * 100).toFixed(0)}% margin for a
        ${esc(S.setup.sub || "shop")}. It is a reasonable estimate, not your real profit.</div></div>` : ""}
    </div></div>`;
}

<script>

function vProd() {

    ${kpi("Running out in 2 days", so.length, so.length ? "order these today" : "nothing urgent", "m",

  ${so.length ? `<div class="act hi" style="margin-bottom:14px">
    <span class="ai">${ic("alert", 18)}</span>
    <span class="ab"><span class="at">${so.length} items run out within 2 days ${TAG.m()}</span>
    <span class="ad">${esc(so[0].name)} has ${so[0].on_hand} left against ${nf(so[0].d7, 0)} forecast for
      the week. Supplier takes ${so[0].lead} day${so[0].lead === 1 ? "" : "s"}.
      ${(() => { const t2 = tm[so[0].sku]; return t2 && t2.peak_hour
        ? `It sells hardest around <b>${t2.peak_hour}:00</b> — being empty then costs you the most.` : ""; })()}</span>

        ${items.slice(0, 26).map(p => `<button onclick="PSEL='${p.sku}';go('prod')"
          style="display:flex;gap:9px;width:100%;text-align:left;padding:8px 9px;border-radius:8px;
          align-items:center;background:${p.sku === sel.sku ? "var(--pb-l)" : "transparent"};

          </span>

        </button>`).join("")}
      </div></div></div>

    <div class="card"><div class="ch"><div class="ct2">${esc(sel.name)} — when it sells ${TAG.m()}
      <div class="cs">${nf(sel.qty)} units and ${inr(sel.revenue)} over the year, at
        ${sel.margin_pct.toFixed(1)}% margin. ${st.peak_hour != null
        ? `Peaks at <b>${st.peak_hour}:00</b> and on <b>${st.peak_wd}</b>.` : ""}</div></div></div>
      <div class="cb">
        <div class="kl" style="font-size:10.5px;margin-bottom:4px">By hour of day</div>
        ${barChart({ data: st.hours, labels: H, h: 160, thick: .72, ml: 44,

          hover: i => `<b>${H[i]}:00 – ${H[i] + 1}:00</b><br>${nf(st.hours[i])} units sold<br>${(st.hours[i] / (sum(st.hours) || 1) * 100).toFixed(1)}% of this item` })}
        <div class="g g2" style="gap:14px;margin-top:14px">
          <div><div class="kl" style="font-size:10.5px;margin-bottom:4px">By day of week</div>
            ${barChart({ data: st.wd, labels: WDN, h: 140, thick: .6, ml: 40, yFmt: v => nf(v),
              colorFn: v => v === Math.max(...st.wd) ? C.ok : C.pb,
              hover: i => `<b>${WDFULL[i]}</b><br>${nf(st.wd[i])} units` })}</div>
          <div><div class="kl" style="font-size:10.5px;margin-bottom:4px">By month</div>
            ${barChart({ data: st.months, labels: mos.map(ymL), h: 140, thick: .6, ml: 40,
              yFmt: v => nf(v), xStep: 2,
              colorFn: v => v === Math.max(...st.months) ? C.warn : C.pb,

            : `It sells steadily through the day, so a short gap in stock is less damaging here.`}

      </div></div>
  </div>

  <div class="g g2 mb">
    <div class="card"><div class="ch"><div class="ct2">What sells most, and when ${TAG.m()}</div></div>
      <div class="cb"><div class="tw"><table>
        <thead><tr><th>Item</th><th class="r">Units</th><th class="r">Money</th>
          <th class="r">Margin</th><th class="c">Peak hour</th><th class="c">Peak day</th></tr></thead>
        <tbody>${items.slice(0, 25).map(p => { const x = tm[p.sku] || {};
          return `<tr><td class="nm">${esc(p.name)}</td>
            <td class="r num">${nf(p.qty)}</td><td class="r num">${inr(p.revenue)}</td>
            <td class="r num" style="color:${p.margin_pct > 15 ? C.ok : p.margin_pct < 8 ? C.warn : "inherit"}">
              ${p.margin_pct.toFixed(1)}%</td>
            <td class="c num">${x.peak_hour ?? "—"}:00</td>
            <td class="c">${x.peak_wd ?? "—"}</td></tr>`; }).join("")}
        </tbody></table></div></div></div>

    <div class="card"><div class="ch"><div class="ct2">Top seller, month by month ${TAG.m()}
      <div class="cs">What people actually came for, in each month.</div></div></div>
      <div class="cb"><div class="tw"><table>
        <thead><tr><th>Month</th><th>Most sold</th><th class="r">Units</th><th class="r">Money</th></tr></thead>
        <tbody>${mos.slice().reverse().map(m => { const x = tbm[m]; if (!x) return "";
          return `<tr><td class="nm">${ymFull(m)}</td><td>${esc(x.name)}</td>
            <td class="r num">${nf(x.qty)}</td><td class="r num">${inrF(x.revenue)}</td></tr>`; }).join("")}
        </tbody></table></div></div></div>
  </div>

  ${dead.length ? `<div class="card"><div class="ch"><div class="ct2">Not moving ${TAG.m()}
    <div class="cs">Money you already spent, sitting still.</div></div></div>
    <div class="cb"><div class="tw"><table>
      <thead><tr><th>Item</th><th class="r">Units left</th><th class="r">Quiet for</th>
        <th class="r">Money stuck</th><th></th></tr></thead>
      <tbody>${dead.map(x => `<tr><td class="nm">${esc(x.name)}<div class="s2">${esc(x.cat)}</div></td>
        <td class="r num">${x.on_hand}</td>
        <td class="r num" style="color:${C.bad};font-weight:620">${x.days_since_sale} days</td>
        <td class="r num">${inrF(x.value)}</td>
        <td class="r"><button class="btn btn-o btn-s"
          onclick="act('Bundle &amp; discount','Paytm Deals')">Clear it</button></td></tr>`).join("")}
      </tbody></table></div>
      <div class="note" style="margin-top:11px">${ic("tag", 15)}<div>
        Clearing all of it at 30% off frees about <b>${inr(d.totals.dead_capital * 0.7)}</b> you can
        put into items that actually move.</div></div>
    </div></div>` : ""}`;
}
window.PSEL = PSEL;

}

/* ========================== YOUR SHARE =========================== */
function vShare() {
  const d = D(), s = SHARE(), f = F();
  const ser = s.share_series;

  return `<div class="note w mb">${ic("info", 16)}<div>
    <b>This screen is different from every other one.</b> Everywhere else, Tracker only uses your own
    shop's records. Here it uses what Paytm sees when your customers pay
    <i>somewhere else</i> — aggregated, never one person. It is the only thing in this app that no

    <b>The figures here are simulated</b> for the demo; the method is real.</div></div>

  <div class="g g4 mb">
    ${kpi("Your share of their spending", s.share_pct + "%",

  <div class="g g21 mb">
    <div class="card"><div class="ch"><div class="ct2">Your share, month by month ${TAG.s()}
      <div class="cs">Of everything your own regulars spend on what you sell, in this area.</div></div></div>
      <div class="cb">${lineChart({
        series: [{ data: ser.map(x => x.share), color: C.pb, w: 2.8, fill: true }],
        labels: ser.map(x => ymL(x.ym)), h: 220, yFmt: v => v.toFixed(1) + "%", xStep: 1,
        min: Math.max(0, Math.floor(Math.min(...ser.map(x => x.share)) - 3)),
        max: Math.ceil(Math.max(...ser.map(x => x.share)) + 2), ticks: 5,
        hover: i => `<b>${ymFull(ser[i].ym)}</b><br>You had ${ser[i].share}% of their spending<br>They spent about ${inrF(ser[i].wallet)} in total` })}
      <div class="note" style="margin-top:4px">${ic("info", 15)}<div>
        You think of these ${nf(s.customers)} people as your customers. They are — for
        <b>${s.share_pct}%</b> of what they buy. The other
        <b>${(100 - s.share_pct).toFixed(1)}%</b> goes to four other places, all within walking
        distance.</div></div></div></div>

    <div class="card"><div class="ch"><div class="ct2">Where the rest goes ${TAG.s()}</div></div>
      <div class="cb">
        ${stackBar(s.leakage.map(l => ({ label: l.where, v: l.amount, color: KIND[l.kind] })), 15)}
        <div style="margin-top:13px">${s.leakage.map(l => `
          <div style="display:flex;gap:9px;align-items:flex-start;padding:9px 0;
            border-bottom:1px solid var(--line-2)">
            <i class="sw2" style="background:${KIND[l.kind]};margin-top:4px"></i>
            <div style="flex:1;min-width:0">
              <div style="font-size:12.5px;font-weight:570;line-height:1.35">${esc(l.where)}</div>
              <div class="s2">${l.pct}% of what leaves you</div></div>
            <div style="text-align:right;flex:0 0 auto">
              <div class="num" style="font-weight:650;font-size:12.5px">${inr(l.amount)}</div>
              <div class="s2 ${l.trend > 0 ? "dn" : "up"}">${pc(l.trend, 0)} this year</div></div>
          </div>`).join("")}</div>
      </div></div>
  </div>

  <div class="card mb"><div class="ch"><div class="ct2" style="color:${C.bad}">
    ${ic("alert", 16)} ${s.switchers.count} of your regulars moved part of their basket to quick commerce ${TAG.s()}
    <div class="cs">They did not stop coming. That is why you never noticed.</div></div></div>
    <div class="cb">
      <div class="g g4" style="gap:12px;margin-bottom:15px">
        ${["Still visiting you", s.switchers.still_visiting + " of " + s.switchers.count,
           "Basket before", inrF(s.switchers.basket_before),
           "Basket now", inrF(s.switchers.basket_after),
           "Costing you", inr(s.switchers.annual_loss) + " a year"]
          .reduce((a, v, i) => { if (i % 2 === 0) a.push([v]); else a[a.length - 1].push(v); return a; }, [])
          .map(([k, v], i) => `<div style="padding:12px 14px;border-radius:var(--r-s);
            background:${i === 3 ? "var(--bad-l)" : "var(--bg)"}">
            <div class="kl" style="font-size:10px">${k}</div>
            <div class="num" style="font-size:19px;font-weight:690;margin-top:3px;
              color:${i === 3 ? C.bad : "inherit"}">${v}</div></div>`).join("")}

      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">

          <b>planned, heavy, packaged</b> part of the basket — which is exactly the part that
          carried your volume. The fix is not price; it is being the easier option for a planned
          order.</div>
        <button class="aa b" onclick="act('Offer these 39 customers a standing order','Paytm Deals + Payment Links')">
          Win the planned basket back</button>
      </div>
    </div></div>

  <div class="g g2">
    <div class="card"><div class="ch"><div class="ct2">People near you who have never paid you ${TAG.s()}
      <div class="cs">Paytm users within walking distance, and how many you actually reach.</div></div></div>
      <div class="cb"><div class="tw" style="max-height:none"><table>
        <thead><tr><th>Distance</th><th class="r">Paytm users</th><th class="r">Your customers</th>
          <th class="r">Reach</th></tr></thead>
        <tbody>${s.catchment.map(c => `<tr><td class="nm">${esc(c.band)}</td>
          <td class="r num">${nf(c.users)}</td><td class="r num">${nf(c.reached)}</td>
          <td class="r"><span class="pill ${c.reach > 50 ? "p-g" : c.reach > 25 ? "p-a" : "p-r"}">
            ${c.reach}%</span></td></tr>`).join("")}
        </tbody></table></div>
        <div class="note" style="margin-top:12px">${ic("users", 15)}<div>
          A cluster of about <b>${nf(s.cluster.users)} people ${s.cluster.dist} ${esc(s.cluster.direction)}</b>

          a tenth of them is <b>${inr(s.cluster.worth)} a month</b>.</div></div>
        <button class="aa b" style="margin-top:11px"
