      <div class="cb">${s.adjacent.map(a => `
        <div style="display:flex;gap:11px;align-items:flex-start;padding:11px 0;
          border-bottom:1px solid var(--line-2)">
          <span style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
            flex:0 0 auto;background:${a.gap ? "var(--ok-l)" : "var(--bg)"};
            color:${a.gap ? C.ok : C.faint}">${ic(a.gap ? "star" : "info", 15)}</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13px">${esc(a.cat)}</div>
            <div class="s2">${esc(a.note)}</div></div>
          <div style="text-align:right;flex:0 0 auto">
            <div class="num" style="font-weight:650;font-size:13px">${inrF(a.monthly)}</div>
            <div class="s2">a month</div></div>
        </div>`).join("")}
        <div class="note g" style="margin-top:12px">${ic("star", 15)}<div>
          <b>${inr(s.adjacent_total)} a month</b> is being spent by people already walking into your
          shop, on things you do not keep. Not every gap is worth filling — but you cannot decide
          that without knowing the number.</div></div>
      </div></div>
  </div>

  <div class="note mb" style="margin-top:14px">${ic("lock", 16)}<div>
    <b>How this stays safe.</b> Tracker never shows you a name, a number or one person's purchases.
    Every figure is an aggregate over at least 30 people, and anything smaller is withheld rather than
    rounded. You see that <i>${s.switchers.count} regulars</i> shifted spending — never which
    ones. Offers go out through Paytm, so the merchant never holds a customer's contact at all.</div></div>`;
}

/* ============================ CREDIT ============================= */
function vCredit() {
  const d = D(), cr = d.credit, cf = d.cashflow, f = F();
  const need = cf.peak_stock_need, have = Math.max(cf.net30, 0), gap = Math.max(0, need - have);
  const col = cr.band === "Prime" ? C.ok : cr.band === "Near-prime" ? C.pb
    : cr.band === "Watch" ? C.warn : C.bad;
  return `<div class="g g21 mb">
    <div class="card"><div class="ch"><div class="ct2">Pre-approved, nothing to fill in ${TAG.m()}
      <div class="cs">Worked out from ${nf(d.meta.days)} days of your own payments. No balance sheet,
        no ITR, no collateral, no shop visit.</div></div></div>
      <div class="cb"><div style="display:flex;gap:24px;flex-wrap:wrap;align-items:center">
        <div style="text-align:center">
          ${gauge({ value: cr.score, min: 300, max: 900, color: col, label: cr.band,
            zones: [[0,.33,"#F6CFD1"],[.33,.55,"#F8E0BA"],[.55,.78,"#B9EAFA"],[.78,1,"#BCE8D7"]] })}
          <div class="s2">Tracker credit score</div></div>
        <div style="flex:1;min-width:230px">
          <div class="g g2" style="gap:11px">
            ${[["You can borrow", inr(cr.limit)], ["Interest", cr.rate + "% a year"],
               ["Over", cr.tenor_months + " months"], ["Monthly EMI", inrF(cr.emi)]]
              .map(([k, v]) => `<div style="padding:11px 13px;background:var(--bg);border-radius:var(--r-s)">
                <div class="kl" style="font-size:10px">${k}</div>
                <div class="num" style="font-size:19px;font-weight:690;margin-top:3px">${v}</div></div>`).join("")}
          </div>
          <div style="margin-top:12px;display:flex;gap:9px;flex-wrap:wrap">
            <button class="btn btn-p" onclick="act('Accept ' + '${inr(cr.limit)}','Paytm Business Loan')">
              Accept ${inr(cr.limit)}</button>
            <button class="btn btn-o" onclick="go('txn')">See why I need it</button></div>
          <div class="s2" style="margin-top:8px">EMI is
            ${(cr.emi / Math.max(f.gp30, 1) * 100).toFixed(0)}% of what you keep in a normal month.</div>
        </div>
      </div></div></div>

    <div class="card"><div class="ch"><div class="ct2">When you will need it
      <div class="cs">This is the part that matters, not the score.</div></div></div>
      <div class="cb">
        <div style="padding:13px;border-radius:var(--r-s);border-left:3px solid ${gap > 0 ? C.warn : C.ok};
          background:${gap > 0 ? "var(--warn-l)" : "var(--ok-l)"}">
          <div style="font-weight:650;font-size:13.5px">${gap > 0 ? "A gap is coming" : "No gap right now"}</div>
          <div style="font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.55">
            ${gap > 0 ? `Your heaviest stocking window is <b>${cf.peak_window_start}</b> to
              <b>${cf.peak_window_end}</b> and needs about ${inrF(need)}. You are projected to have
              ${inrF(have)}.` : `You are projected to have ${inrF(have)} against ${inrF(need)} of stock to buy.`}</div>
        </div>
        ${hBars({ rows: [{ label: "Stock to buy", v: need, color: C.warn },
          { label: "Cash you will have", v: have, color: C.pb },
          ...(gap > 0 ? [{ label: "Short by", v: gap, color: C.bad }] : [])], fmt: inrF })}
        <div class="hr"></div>
        <div style="font-size:12.5px;color:var(--ink-2);line-height:1.6">
          Shopkeepers rarely fail to get a loan. They fail because the money arrives
          <b>after</b> the festival. Tracker watches the forecast and raises this
          <b>10 to 14 days before</b> the squeeze.</div>
      </div></div>
  </div>

  <div class="g g2">
    <div class="card"><div class="ch"><div class="ct2">What was looked at ${TAG.m()}
      <div class="cs">All of it measured from your payments. None of it from a credit bureau.</div></div></div>
      <div class="cb">${cr.drivers.map(x => `
        <div style="display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-2)">
          <span style="width:22px;height:22px;border-radius:7px;display:grid;place-items:center;
            flex:0 0 auto;background:${x.good ? "var(--ok-l)" : "var(--bad-l)"};
            color:${x.good ? C.ok : C.bad}">${ic(x.good ? "check" : "alert", 13)}</span>
          <span style="flex:1;font-size:13px">${esc(x.f)}</span>
          <span class="num" style="font-weight:650;font-size:13.5px">${x.v}${
            /^[% ]/.test(x.unit) ? esc(x.unit) : " " + esc(x.unit)}</span></div>`).join("")}
        <div class="note" style="margin-top:13px">${ic("info", 15)}<div>
          A shop with no books and no borrowing history still has a year of payments nobody can fake.
          That turns out to carry most of the signal.</div></div>
      </div></div>

    <div class="card"><div class="ch"><div class="ct2">How the number was built
      <div class="cs">No model output goes to a lender untouched.</div></div></div>
      <div class="cb">
        ${[["Range check", (cr.clipped && cr.clipped.length) ? cr.clipped.length + " clipped" : "all in range",
            (cr.clipped && cr.clipped.length)
              ? cr.clipped.map(c => `${c.f} was ${c.raw}, scored at ${c.used}`).join("; ")
                + " — a model asked to work outside its training range returns a confident wrong answer"
              : "every input sits inside the range the model was trained on, so nothing had to be clipped"],
           ["What the model said", cr.pd_model + "% chance of default", "from payment behaviour alone"],
           ["Floor for this kind of shop", cr.floor + "%",
            "risk a payment stream genuinely cannot see — no audited books, family borrowing, tenancy"],
           ["What gets priced", cr.pd + "%", "the higher of the two, always"],
           ["Ceiling", inr(cr.cap), "before the risk haircut"],
           ["Final", inr(cr.limit), "ceiling × (1 − risk), rounded down"]]
          .map(([k, v, w]) => `<div style="padding:9px 0;border-bottom:1px solid var(--line-2)">
            <div style="display:flex;justify-content:space-between;gap:10px">
              <span style="font-weight:600;font-size:13px">${k}</span>
              <span class="num" style="font-weight:680">${v}</span></div>
            <div class="s2" style="margin-top:2px">${w}</div></div>`).join("")}
      </div></div>
  </div>`;
}

/* ============================= ABOUT ============================= */
function vAbout() {
  const d = D();
  return `<div class="note mb">${ic("info", 16)}<div>
    A demo that hides what is fake is worth less than one that says so. Here is exactly what is
    computed, what is assumed, and what is modelled.</div></div>

  <div class="g g3 mb">
    ${[["\u{1F7E6} Measured", "Added up or fitted from the transaction file. Reproducible — run the same maths on the same rows and you get the same answer.",
        "Earnings, trends, averages, peak hours, products, margins, the credit features", C.pb],
       ["\u{1F7E8} Guess", "A reasonable explanation Tracker cannot prove. Always labelled, never dressed up as fact.",
        "Why an unexplained dip happened, margin for a shop with no cost data", C.warn],
       ["\u{1F7EA} Simulated", "Modelled for this demo because the real feed is not wired up here.",
        "Everything on Your Share — the cross-merchant view", "#6A4FD8"]]
      .map(([t2, d2, w, c]) => `<div class="card"><div class="cb">
        <div style="font-weight:660;font-size:14px;color:${c}">${t2}</div>
        <div style="color:var(--ink-2);font-size:12.5px;margin-top:6px;line-height:1.55">${d2}</div>
        <div class="hr" style="margin:11px 0"></div>
        <div class="s2">${w}</div></div></div>`).join("")}
  </div>

  <div class="g g2 mb">
    <div class="card"><div class="ch"><div class="ct2">The data behind this demo</div></div>
      <div class="cb">${[
        ["Shop", d.merchant.name + " · " + d.merchant.city],
        ["Window", dLong(new Date(d.meta.day0 + "T00:00:00")) + " to " + dLong(new Date(d.meta.asof + "T00:00:00"))],
        ["Days", nf(d.meta.days)],
        [tracked() ? "Bills" : "Payments", nf(d.totals.bills || d.totals.txns)],
        ...(tracked() ? [["Line items", nf(d.totals.units)], ["Products", nf(d.merchant.skus)]] : []),
        ["Customers seen", nf(d.customers.total)],
        ["Money", inr(d.totals.revenue)],
      ].map(([k, v]) => `<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;
        border-bottom:1px solid var(--line-2);font-size:13px">
        <span style="color:var(--mut)">${k}</span><span class="num" style="font-weight:600">${v}</span></div>`).join("")}
        <div class="note w" style="margin-top:12px">${ic("info", 15)}<div>
          This shop is synthetic — generated with realistic weekday rhythm, salary-cycle bumps,
          festival spikes, monsoon effects, genuine dead stock and customers who lapse. It is not a
          real merchant's data, and no real merchant's data was used.</div></div>
      </div></div>

    <div class="card"><div class="ch"><div class="ct2">What Tracker refuses to do</div></div>
      <div class="cb">${[
        ["Invent what was sold", "For a shop with no billing, Products stays locked. A ₹140 payment carries no item and no model is run against it."],
        ["Call an estimate a fact", "Profit without cost data is labelled a guess on every screen it appears on."],
        ["Let a language model do arithmetic", "Every number is computed in code first. The assistant only puts those numbers into words, so it cannot invent one."],
        ["Show one customer", "Your Share aggregates over at least 30 people. Below that, the figure is withheld, not rounded."],
        ["Hand a raw model output to a lender", "A floor is applied for risk the data genuinely cannot see."],
      ].map(([k, v]) => `<div style="padding:10px 0;border-bottom:1px solid var(--line-2)">
        <div style="font-weight:620;font-size:13px">${k}</div>
        <div style="color:var(--ink-2);font-size:12.5px;margin-top:3px;line-height:1.5">${v}</div></div>`).join("")}
      </div></div>
  </div>

  <div class="card"><div class="ch"><div class="ct2">Models used, and what they scored</div></div>
    <div class="cb"><div class="tw"><table>
      <thead><tr><th>Model</th><th>Job</th><th class="r">Score</th><th>Against</th></tr></thead>
      <tbody>${(d.model_report || []).map(r => `<tr>
        <td class="nm">${esc(r.model)}<div class="s2">${esc(r.note)}</div></td>
        <td style="font-size:12.5px">${esc(r.task)}</td>
        <td class="r"><span class="num" style="font-weight:680">${esc(String(r.value))}</span>
          <div class="s2">${esc(r.metric)}</div></td>
        <td class="s2" style="max-width:250px">${esc(r.baseline)}</td></tr>`).join("")}
      </tbody></table></div></div></div>`;
}

</script>
<script>
/* ==================================================================
   Tracker — retrieval layer.

   Every computed figure is written out as a short, self-describing
   fact. A question retrieves the handful of facts that bear on it, and
   only those go to the model. The model never sees the whole dataset
   and is never asked to do arithmetic.
   ================================================================== */

let KB = null, KB_FOR = null;

function buildKB() {
  const d = D(), s = SHARE(), f = F(), kb = [];
  const add = (id, topic, text, keys) =>
    kb.push({ id, topic, text, keys: (keys || "").toLowerCase() });

  /* --- the shop itself --- */
  add("shop", "shop",
    `${d.merchant.name} is a ${S.setup.sub || d.merchant.category} in ${d.merchant.city}, trading since ${d.merchant.since}. `
    + `${tracked() ? "It records every bill, so item-level data is available." : "It takes payments by QR only and does not record what it sells, so there is no item-level data at all."} `
    + `Tracker has ${nf(d.meta.days)} days of records, from ${dLong(new Date(d.meta.day0 + "T00:00:00"))} to ${dLong(new Date(d.meta.asof + "T00:00:00"))}.`,
    "shop business about store name city");

  add("totals", "totals",
    `Over the whole ${nf(d.meta.days)} days the shop received ${inrF(d.totals.revenue)} across ${nf(d.totals.bills || d.totals.txns)} ${tracked() ? "bills" : "payments"}. `
    + (tracked()
      ? `Goods cost ${inrF(d.totals.cogs)}, leaving ${inrF(d.totals.gross_profit)} kept, a margin of ${d.totals.margin_pct}%. It stocks ${nf(d.merchant.skus)} different products.`
      : `At the declared margin of ${d.totals.declared_margin}% that is about ${inrF(d.totals.est_gross)} kept, which is an estimate and not measured.`),
    "total overall year revenue sales profit margin everything");

  /* --- period figures --- */
  const periods = [
    ["today", rng({ kind: "today" })], ["yesterday", rng({ kind: "yesterday" })],
    ["the last 7 days", rng({ kind: "last7" })], ["the last 30 days", rng({ kind: "last30" })],
    ["this week so far", rng({ kind: "thisweek" })], ["last week", rng({ kind: "lastweek" })],
    ["this month so far", rng({ kind: "thismonth" })], ["last month", rng({ kind: "lastmonth" })],
  ];
  periods.forEach(([name, r], i) => {
    const a = agg(r);
    add("period" + i, "earnings",
      `In ${name} (${dLong(dateAt(r.a))} to ${dLong(dateAt(r.b))}, ${a.days} days) the shop received ${inrF(a.rev)} `
      + `from ${nf(a.tx)} ${tracked() ? "bills" : "payments"}, averaging ${inrF(a.atv)} per sale and ${inrF(a.rev / a.days)} per day. `
      + `${tracked() ? `Goods cost ${inrF(a.cogs)}, so ${inrF(a.profit)} was kept.` : `At the declared margin about ${inrF(a.profit)} was kept, estimated.`}`,
      `${name} earn earned earnings revenue sales income profit kamaya kitna`);
  });

  /* --- every month --- */
  d.monthly.forEach((m, i) => {
    add("month" + i, "earnings",
      `In ${ymFull(m.ym)} the shop received ${inrF(m.revenue)} over ${m.days} trading days from `
      + `${nf(m.bills || m.txns)} ${tracked() ? "bills" : "payments"}`
      + (tracked() ? `, goods cost ${inrF(m.cogs)} and ${inrF(m.gross_profit)} was kept.` : `.`)
      + (m.days < 25 ? " That month is incomplete." : ""),
      `${ymFull(m.ym).toLowerCase()} ${MONTHFULL_L(m.ym)} month earnings revenue`);
  });

  /* --- weeks --- */
  (d.weekly || []).slice(-14).forEach((w, i) => {
    add("week" + i, "earnings",
      `The week starting ${dLong(new Date(w.w + "T00:00:00"))} brought ${inrF(w.revenue)} from ${nf(w.bills)} `
      + `${tracked() ? "bills" : "payments"}, averaging ${inrF(w.revenue / w.bills)} per sale.`,
      "week weekly hafta earnings");
  });

  /* --- weekdays --- */
  f.wd.forEach(w => {
    add("wd" + w.wd, "weekday",
      `On an average ${WDFULL[w.wd]} the shop takes ${inrF(w.revenue)}, which is ${pc(w.vs_avg)} against its other days. `
      + (w.vs_avg < -5 ? `That gap costs about ${inrF(f.wdMean - w.revenue)} every week, or ${inr((f.wdMean - w.revenue) * 52)} a year.` : "")
      + (w.wd === f.worst.wd ? " This is the weakest day of the week." : "")
      + (w.wd === f.best.wd ? " This is the strongest day of the week." : ""),
      `${WDFULL[w.wd].toLowerCase()} ${WDN[w.wd].toLowerCase()} day weekday worst best weakest strongest din`);
  });
  add("wdsum", "weekday",
    `Across the week the best day is ${WDFULL[f.best.wd]} at ${inrF(f.best.revenue)} and the worst is `
    + `${WDFULL[f.worst.wd]} at ${inrF(f.worst.revenue)}. A normal day is ${inrF(f.wdMean)}. `
    + `The gap between best and worst is ${inrF(f.best.revenue - f.worst.revenue)} a week, ${inr((f.best.revenue - f.worst.revenue) * 52)} a year.`,
    "worst day best day weakest lowest highest which day kaunsa din");

  /* --- hours --- */
  const hs = f.hr.slice().sort((a, b) => b.revenue - a.revenue);
  add("hours", "hour",
    `The busiest hour is ${hs[0].h}:00, carrying ${hs[0].share.toFixed(1)}% of a day's money. `
    + `The three busiest hours are ${hs.slice(0, 3).map(x => x.h + ":00").join(", ")}, together ${sum(hs.slice(0, 3).map(x => x.share)).toFixed(0)}%. `
    + `The quietest is ${hs[hs.length - 1].h}:00 at ${hs[hs.length - 1].share.toFixed(1)}%.`,
    "hour time busiest peak rush when what time kab samay");
  d.hourly.forEach(h => add("hr" + h.h, "hour",
    `Between ${h.h}:00 and ${h.h + 1}:00 the shop takes ${inrF(h.revenue)} over the whole period, `
    + `${h.share.toFixed(1)}% of all its money.`, `${h.h} hour time oclock`));

  /* --- averages --- */
  const open = f.dl.filter(x => x.revenue > 0);
  const srt = open.map(x => x.revenue).sort((a, b) => a - b);
  add("avg", "average",
    `A normal day is ${inrF(mean(open.map(x => x.revenue)))}, a normal week ${inrF(mean(open.map(x => x.revenue)) * 7)} `
    + `and a normal month ${inrF(mean(open.map(x => x.revenue)) * 30.4)}. A normal sale is ${inrF(f.atv30)}. `
    + `A really good day is above ${inrF(srt[Math.floor(srt.length * .9)])} and a genuinely slow day is below ${inrF(srt[Math.floor(srt.length * .1)])}.`,
    "average normal typical usual ausat mean");

  /* --- growth --- */
  add("growth", "growth",
    `Over the last 30 days the shop took ${inrF(f.r30)}, which is ${pc(f.g30)} against the 30 days before. `
    + `${tracked() ? "Bills" : "Payments"} moved ${pc(f.tg30)} and the average sale moved ${pc((f.atv30 / f.atv30p - 1) * 100)}. `
    + `${Math.abs(f.tg30) > Math.abs((f.atv30 / f.atv30p - 1) * 100) * 1.5
      ? "So the change is driven by how many people came, not by how much each spent."
      : "So the change is driven by how much each person spent, not by how many came."}`,
    "growth growing shrinking trend better worse improving falling");

  /* --- the decomposition of the worst recent week --- */
  const wks = (d.weekly || []).slice(-13, -1);
  if (wks.length) {
    const worstW = wks.slice(-4).slice().sort((a, b) => a.revenue - b.revenue)[0];
    const nTx = mean(wks.map(x => x.bills)), nRev = mean(wks.map(x => x.revenue));
    const dTx = (worstW.bills / nTx - 1) * 100;
    const dAtv = ((worstW.revenue / worstW.bills) / (nRev / nTx) - 1) * 100;
    add("worstweek", "diagnosis",
      `The weakest recent week started ${dLong(new Date(worstW.w + "T00:00:00"))} with ${inrF(worstW.revenue)}, `
      + `${pc((worstW.revenue / nRev - 1) * 100)} against a normal week. Breaking it apart: the number of customers moved `
      + `${pc(dTx)} and the spend per customer moved ${pc(dAtv)}. `
      + (Math.abs(dTx) > Math.abs(dAtv) * 1.6
        ? "So this was a footfall problem: fewer people walked in, while baskets held up. Offering a discount to existing customers will not fix that, because they already came."
        : Math.abs(dAtv) > Math.abs(dTx) * 1.6
        ? "So this was a basket problem: roughly the usual number of people came but each spent less, which usually means something they wanted was out of stock."
        : "Both fell together, so footfall should be dealt with first as it is the larger and easier of the two."),
      "why bad week drop fell down decline weak reason problem footfall basket");
  }

  /* --- anomalies --- */
  (d.anomalies || []).slice(0, 8).forEach((a, i) => add("anom" + i, "anomaly",
    `On ${dLong(new Date(a.d + "T00:00:00"))} the shop took ${inrF(a.actual)} when ${inrF(a.expected)} was expected, `
    + `a ${a.kind} of ${pc((a.actual / a.expected - 1) * 100, 0)}. `
    + (a.festival ? `This is explained by ${a.festival}.` : "There is no known explanation for this one."),
    `${a.d} unusual spike dip strange odd anomaly ${a.festival || ""}`));

  /* --- products --- */
  if (tracked()) {
    const items = d.sku_list, tm = d.timing || {};
    add("prodsum", "product",
      `By money the top sellers are ${items.slice(0, 5).map(p => `${p.name} (${inrF(p.revenue)})`).join(", ")}. `
      + `By units the busiest is ${items.slice().sort((a, b) => b.qty - a.qty)[0].name}. `
      + `The top ten items together make ${items.slice(0, 10).reduce((a, p) => a + p.profit_share, 0).toFixed(0)}% of all the profit.`,
      "product item sells most best selling top what sells saman bika");
    items.slice(0, 45).forEach((p, i) => {
      const t2 = tm[p.sku] || {};
      add("sku:" + p.sku, "product",
        `${p.name} (${p.cat}) sold ${nf(p.qty)} units for ${inrF(p.revenue)}, cost ${inrF(p.cogs)}, kept ${inrF(p.gross_profit)} `
        + `at a ${p.margin_pct.toFixed(1)}% margin. It appeared in ${nf(p.bills)} bills and ${nf(p.on_hand)} units are on the shelf now. `
        + (t2.peak_hour != null
          ? `It sells hardest at ${t2.peak_hour}:00 (${t2.hour_share}% of it goes in that hour), its best day is ${t2.peak_wd} and its best month was ${ymFull(t2.peak_month)}.`
          : ""),
        `${p.name.toLowerCase()} ${p.cat.toLowerCase()} product item when sells peak hour`);
    });
    (d.top_by_month ? Object.entries(d.top_by_month) : []).forEach(([m, x], i) =>
      add("tbm" + i, "product",
        `In ${ymFull(m)} the single most sold item by units was ${x.name}, ${nf(x.qty)} units worth ${inrF(x.revenue)}.`,
        `${ymFull(m).toLowerCase()} most sold top product month`));
    if ((d.dead_stock || []).length) add("dead", "product",
      `${d.dead_stock.length} items have not sold for three weeks or more, holding ${inrF(d.totals.dead_capital)} of stock. `
      + `The worst are ${d.dead_stock.slice(0, 4).map(x => `${x.name} (${x.on_hand} units, ${x.days_since_sale} days quiet, ${inrF(x.value)})`).join("; ")}.`,
      "dead stock not selling slow nothing moving stuck unsold");
    if ((d.stockout || []).length) add("stockout", "product",
      `${d.stockout.length} items will run out within two days. The most urgent are `
      + `${d.stockout.slice(0, 4).map(x => `${x.name} (${x.on_hand} left, ${nf(x.d7, 0)} forecast this week, supplier takes ${x.lead} day${x.lead === 1 ? "" : "s"})`).join("; ")}.`,
      "stock out running low reorder order finish khatam");
  } else {
    add("noitem", "product",
      `This shop does not record what it sells. A payment only says how much money arrived, never which items were bought. `
      + `So there is no answer to any question about products, margins per item, stock or reordering, and Tracker must say so rather than guess.`,
      "product item sells most stock margin reorder what sells");
  }

  /* --- customers --- */
  const c = d.customers;
  add("cust", "customer",
    `Tracker recognises ${nf(c.total)} repeat customers, covering ${c.attributed_share}% of sales. `
    + `The top fifth of them bring ${c.pareto}% of that money. By segment: `
    + `${c.segments.filter(x => x.customers).map(x => `${x.customers} ${x.segment}`).join(", ")}. `
    + `${c.winback.length} regulars have gone quiet and are worth about ${inrF(c.at_risk)} over three months.`,
    "customer regular grahak people repeat loyal lapsed quiet stopped coming");

  /* --- credit --- */
  const cr = d.credit, cf = d.cashflow;
  add("credit", "credit",
    `The shop is pre-approved for ${inrF(cr.limit)} at ${cr.rate}% over ${cr.tenor_months} months, EMI ${inrF(cr.emi)}. `
    + `Its score is ${cr.score} out of 900, band ${cr.band}, with an applied default risk of ${cr.pd}% `
    + `(the model said ${cr.pd_model}% and a ${cr.floor}% floor is applied for risk payments cannot see). `
    + `No paperwork is needed because it is underwritten from the payment history itself.`,
    "loan credit borrow money score karz udhaar finance emi");
  add("cash", "credit",
    `Over the next 30 days collections are forecast at ${inrF(cf.inflow30)}. Restocking will take ${inrF(cf.restock30)} and `
    + `fixed costs ${inrF(cf.fixed30)}, leaving ${inrF(cf.net30)}. The heaviest stocking window is `
    + `${cf.peak_window_start} to ${cf.peak_window_end}, needing about ${inrF(cf.peak_stock_need)}`
    + (cf.peak_stock_need > Math.max(cf.net30, 0)
      ? `, so the shop will be short by roughly ${inrF(cf.peak_stock_need - Math.max(cf.net30, 0))} and that is when to borrow.`
      : `, which the projected cash covers.`),
    "cash flow money next month shortfall short need stock buy");

  /* --- share (simulated) --- */
  if (s) {
    add("share", "share",
      `SIMULATED FIGURE. The shop's ${nf(s.customers)} regulars spend about ${inrF(s.wallet)} a month on this category nearby. `
      + `${inrF(s.from_known)} of that comes to this shop, a share of ${s.share_pct}%, which has moved ${s.share_change} points over the year. `
      + `The other ${inrF(s.rest)} a month goes to: ${s.leakage.map(l => `${l.where} ${inrF(l.amount)} (${pc(l.trend, 0)} this year)`).join("; ")}.`,
      "share wallet competitor elsewhere losing leak blinkit zepto quick commerce other shops hissa");
    add("switch", "share",
      `SIMULATED FIGURE. ${s.switchers.count} regulars moved part of their basket to quick commerce. `
      + `${s.switchers.still_visiting} of them still visit, but the basket fell from ${inrF(s.switchers.basket_before)} to ${inrF(s.switchers.basket_after)}, `
      + `costing ${inrF(s.switchers.monthly_loss)} a month or ${inrF(s.switchers.annual_loss)} a year. `
      + `What moved: ${s.switchers.moved.map(([k, v]) => `${k} ${v}%`).join(", ")}. They kept buying fresh and last-minute items here and moved the planned, packaged part.`,
      "quick commerce blinkit zepto instamart switching losing customers basket smaller");
    add("catch", "share",
      `SIMULATED FIGURE. Within walking distance there are Paytm users the shop has never served: `
      + `${s.catchment.map(x => `${x.band}: ${nf(x.users)} users, ${x.reach}% reached`).join("; ")}. `
      + `A cluster of about ${nf(s.cluster.users)} people ${s.cluster.dist} ${s.cluster.direction} walks past to reach the market, `
      + `spending about ${inrF(s.cluster.spend)} a month each.`,
      "nearby area catchment new customers never visited reach neighbourhood");
    add("adj", "share",
      `SIMULATED FIGURE. The shop's own customers spend money nearby on things it does not stock: `
      + `${s.adjacent.map(a => `${a.cat} ${inrF(a.monthly)} a month (${a.note})`).join("; ")}. `
      + `The gaps worth filling total about ${inrF(s.adjacent_total)} a month.`,
      "what else stock new products expand opportunity categories not selling");
  }

  /* --- expenses --- */
  add("exp", "costs",
    `Fixed costs are ${inrF(d.fixed_monthly)} a month: `
    + Object.entries(d.expenses).map(([k, v]) => `${k.replace(/_/g, " ")} ${inrF(v)}`).join(", ")
    + `. Break-even needs about ${inrF(d.fixed_monthly / (marginPct() / 100) / 30)} of sales a day.`,
    "cost expense rent staff salary electricity fixed kharcha break even");

  return kb;
}
function MONTHFULL_L(ym) { return MONFULL[+ym.split("-")[1] - 1].toLowerCase(); }

function kb() {
  const key = S.who;
  if (!KB || KB_FOR !== key) { KB = buildKB(); KB_FOR = key; }
  return KB;
}

/* ------------------------- BM25 retrieval ------------------------- */
const STOP = new Set(("a an the is are was were be been of to in on for my me i you your it this that and or "
  + "how much many what which when where why do does did can could should shall will would tell show give "
  + "mujhe mera meri ka ki ke ko se hai hain kya").split(" "));
const tok = s => (s || "").toLowerCase().replace(/[^\p{L}\p{N}\s:]/gu, " ")
  .split(/\s+/).filter(w => w.length > 1 && !STOP.has(w));

let IDF = null, IDF_FOR = null;
function idf() {
  if (IDF && IDF_FOR === S.who) return IDF;
  const docs = kb(), df = new Map();
  docs.forEach(d2 => {
    new Set(tok(d2.text + " " + d2.keys)).forEach(w => df.set(w, (df.get(w) || 0) + 1));
  });
  const N = docs.length, m = new Map();
  df.forEach((v, w) => m.set(w, Math.log(1 + (N - v + 0.5) / (v + 0.5))));
  IDF = m; IDF_FOR = S.who;
  return m;
}
function retrieve(q, k = 8) {
  const docs = kb(), I = idf(), qt = tok(q);
  if (!qt.length) return docs.slice(0, k);

  // If the question names a specific product, lexical scoring alone buries its
  // own fact under every other chunk that happens to mention it. The parser
  // already identifies the item, so pin that fact to the front.
  let pinned = [];
  try {
    const named = parse(q).prod;
    if (named) {
      const own = docs.find(d2 => d2.id === "sku:" + named.sku);
      if (own) pinned = [own];
    }
  } catch (e) {}
  const avg = mean(docs.map(d2 => tok(d2.text).length)) || 1;
  const k1 = 1.4, b = 0.72;
  const scored = docs.map(d2 => {
    const dt = tok(d2.text + " " + d2.keys), len = dt.length;
    const tf = new Map();
    dt.forEach(w => tf.set(w, (tf.get(w) || 0) + 1));
    let s = 0;
    qt.forEach(w => {
      const t2 = tf.get(w) || 0;
      if (!t2) return;
      s += (I.get(w) || 0.2) * (t2 * (k1 + 1)) / (t2 + k1 * (1 - b + b * len / avg));
      if ((d2.keys || "").includes(w)) s += 1.1;     // a keyword hit is a strong signal
    });
    return { d: d2, s };
  }).filter(x => x.s > 0).sort((a, b2) => b2.s - a.s);
  const rest = scored.map(x => x.d).filter(d2 => !pinned.includes(d2));
  return pinned.concat(rest).slice(0, k);
}
window.retrieve = retrieve;

</script>
<script>
/* ==================================================================
   Tracker — Sarvam integration.

   Division of labour, and it matters:
     • Arithmetic   -> the deterministic engine, in code. Always.
     • Retrieval    -> BM25 over written-out facts, in code.
     • Language     -> sarvam-105b. Phrasing only, on supplied facts.
     • Speech in    -> saaras, any Indian language.
     • Speech out   -> bulbul, in the language that was spoken.

   The model is never asked what a number is. It is handed the numbers
   and asked to speak. If it is unreachable, the offline engine answers.
   ================================================================== */

const SV = {
  base: "https://api.sarvam.ai",
  chat: "sarvam-105b",
  tts: "bulbul:v3",
  stt: "saaras:v2.5",
  key: null,
  on: false,          // live mode
  busy: false,
  lastErr: null,
};
const SPEAKER = { "en-IN": "anushka", "hi-IN": "anushka", "te-IN": "anushka",
                  "ta-IN": "anushka", "kn-IN": "anushka", "ml-IN": "anushka",
                  "mr-IN": "anushka", "bn-IN": "anushka", "gu-IN": "anushka",
                  "pa-IN": "anushka", "od-IN": "anushka" };
const LANGNAME = { "en-IN": "English", "hi-IN": "Hindi", "te-IN": "Telugu", "ta-IN": "Tamil",
                   "kn-IN": "Kannada", "ml-IN": "Malayalam", "mr-IN": "Marathi",
                   "bn-IN": "Bengali", "gu-IN": "Gujarati", "pa-IN": "Punjabi" };

function svLoad() {
  try {
    const k = sessionStorage.getItem("sv_key");
    const b = sessionStorage.getItem("sv_base");
    if (b) SV.base = b;
    if (k) { SV.key = k; SV.on = true; }
  } catch (e) {}
}
function svSave(k, base) {
  SV.key = (k || "").trim();
  SV.base = (base || "https://api.sarvam.ai").replace(/\/+$/, "");
  SV.on = !!SV.key;
  try {
    if (SV.on) { sessionStorage.setItem("sv_key", SV.key); sessionStorage.setItem("sv_base", SV.base); }
    else { sessionStorage.removeItem("sv_key"); sessionStorage.removeItem("sv_base"); }
  } catch (e) {}
}

async function svFetch(path, opts) {
  const r = await fetch(SV.base + path, {
    ...opts,
    headers: { "api-subscription-key": SV.key, ...(opts.headers || {}) },

    const t = await r.text().catch(() => "");

  }
  return r;
}

/* --------------------------- generation --------------------------- */
const SYS = `You are Tracker, a business assistant for a small Indian shopkeeper.

ABSOLUTE RULES — breaking any of these makes you useless:
1. Every number you state must appear in the FACTS or the VERIFIED ANSWER below. Never calculate, estimate, round differently, or invent a figure. If a number is not given to you, say you do not have it.
2. The VERIFIED ANSWER, when present, was computed in code from the shop's records. Use its figure exactly as given. Do not restate it differently.
3. A fact marked SIMULATED FIGURE is modelled for a demo, not measured. If you use one, say so plainly in the "means" field.
4. If the FACTS do not answer the question, say so. Never fill a gap with a guess.
5. Speak to a shopkeeper, not an analyst. Short sentences. No jargon, no bullet points, no markdown.

Reply with ONLY a JSON object, no other text:
{"value":"the single headline figure or name, very short",
 "sub":"a few words saying what it is and for what period",
 "means":"one or two sentences explaining what it means, with a comparison if the facts give one",
 "act":"one sentence on what the shopkeeper should actually do, or null if there is nothing to do",
 "tag":"m if every number came from measured records, s if you used a SIMULATED figure, g if any part is an estimate"}`;

function buildPrompt(q, det, chunks) {
  const lang = LANGNAME[VOICE[S.lang]] || "English";
  let p = `LANGUAGE: Write every field in ${lang}. Keep numbers in digits with the ₹ symbol.\n\n`;
  if (det) {
    p += `VERIFIED ANSWER (computed in code — use this figure exactly):\n`
      + `value: ${det.value}\nwhat it is: ${det.sub}\n`
      + (det.ev && det.ev.length ? `supporting rows:\n${det.ev.map(([k, v]) => `  ${k}: ${v}`).join("\n")}\n` : "")
      + `\n`;
  }
  p += `FACTS retrieved for this question:\n`
    + chunks.map((c, i) => `[${i + 1}] ${c.text}`).join("\n")
    + `\n\nQUESTION: ${q}\n`;
  return p;
}

async function svAsk(q) {
  const det = answer(parse(q));               // arithmetic first, always
  const chunks = retrieve(q, 8);
  const body = {
    model: SV.chat,
    messages: [{ role: "system", content: SYS },
               { role: "user", content: buildPrompt(q, det, chunks) }],
    temperature: 0.2,
    max_tokens: 700,
    response_format: { type: "json_object" },
  };
  const r = await svFetch("/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const j = await r.json();
  let txt = j.choices?.[0]?.message?.content || "";
  txt = txt.replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
  const m = txt.match(/\{[\s\S]*\}/);
  const o = JSON.parse(m ? m[0] : txt);
  return {
    value: String(o.value ?? det?.value ?? "—"),
    sub: String(o.sub ?? det?.sub ?? ""),
    means: String(o.means ?? ""),
    act: o.act && String(o.act).toLowerCase() !== "null" ? String(o.act) : null,
    actTab: det?.actTab || null,
    tag: ["m", "s", "g"].includes(o.tag) ? o.tag : (det?.tag || "m"),
    ev: det?.ev || [],
    locked: det?.locked || false,
    live: true,
    used: chunks.map(c => c.id),
    verified: !!det,
  };
}

/* ------------------------------ speech ---------------------------- */
async function svSpeak(a, langCode) {
  const code = langCode || VOICE[S.lang] || "en-IN";
  const text = `${a.value}. ${a.sub}. ${a.means}${a.act ? " " + a.act : ""}`.slice(0, 1400);
  const r = await svFetch("/text-to-speech", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      text, target_language_code: code, model: SV.tts,
      speaker: SPEAKER[code] || "anushka", pace: 1.0,
    }),
  });
  const j = await r.json();
  const b64 = (j.audios && j.audios[0]) || j.audio;
  if (!b64) throw new Error("no audio returned");
  const au = new Audio("data:audio/wav;base64," + b64);
  au.play().catch(() => {});
  return au;
}

let MR = null, CHUNKS = [], RECING2 = false;
async function svListen() {
  const btn = document.getElementById("micBtn");
  if (RECING2) { try { MR.stop(); } catch (e) {} return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    return micBlocked("The microphone is blocked here.");
  }
  CHUNKS = [];
  const mime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
  MR = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  MR.ondataavailable = e => e.data.size && CHUNKS.push(e.data);
  MR.onstart = () => { RECING2 = true; btn.classList.add("rec"); };
  MR.onstop = async () => {
    RECING2 = false; btn.classList.remove("rec");
    stream.getTracks().forEach(t2 => t2.stop());
    const blob = new Blob(CHUNKS, { type: mime || "audio/webm" });
    if (blob.size < 1200) return;
    S.chat.push({ me: true, text: "\u{1F399} …" });
    S.chat.push({ typing: true });
    renderFeed();
    try {
      const fd = new FormData();
      fd.append("file", blob, "q.webm");
      fd.append("model", SV.stt);
      const r = await svFetch("/speech-to-text-translate", { method: "POST", body: fd });
      const j = await r.json();
      const text = (j.transcript || j.text || "").trim();
      const srcLang = j.language_code || null;
      S.chat.pop();
      S.chat[S.chat.length - 1] = { me: true, text: text || "(nothing heard)", spoken: true,
                                    lang: srcLang };
      renderFeed();
      if (text) {
        if (srcLang && LANGNAME[srcLang]) {
          const ui = Object.keys(VOICE).find(k => VOICE[k] === srcLang);
          if (ui) { S.lang = ui; const sel = document.getElementById("langSel"); if (sel) sel.value = ui; }
        }
        askNow(text, srcLang);
      }
    } catch (e) {
      S.chat.pop();
      S.chat.push({ a: null, err: "Could not transcribe: " + e.message });
      renderFeed();
    }
  };
  MR.start();
  setTimeout(() => { if (RECING2) try { MR.stop(); } catch (e) {} }, 12000);
}

/* ------------------------- the key panel -------------------------- */

  }
  return `<div class="card"><div class="cb">

    <div class="s2" style="line-height:1.55;margin-bottom:10px">
      Without a key Tracker answers from its built-in engine — accurate, but only the questions it

      to speech.</div>
    <input id="svKey" type="password" placeholder="sk_..." autocomplete="off"
      style="width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;
      font-size:13px;font-family:var(--mono)">
    <input id="svBase" placeholder="https://api.sarvam.ai  (or your proxy)"
      style="width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;
      font-size:12px;font-family:var(--mono);margin-top:7px">
    <button class="btn btn-b" style="width:100%;margin-top:9px"
      onclick="svConnect()">Connect</button>
    <div class="s2" style="margin-top:9px;line-height:1.5">
      Stored in this browser tab only. If the browser blocks the call (CORS), run the little proxy

}
function svConnect() {
  const k = document.getElementById("svKey").value;
  const b = document.getElementById("svBase").value;
  if (!k.trim()) return;
  svSave(k, b);

<script>
/* ==================================================================
   Tracker — the question engine.

   Deliberately NOT a language model doing arithmetic. The question is
   parsed into an intent and a date range, the numbers are computed in
   code, and only then are they put into a sentence. It can fail to
   understand you. It cannot invent a figure.
   ================================================================== */

const MONTH_WORDS = {
  january:0, jan:0, february:1, feb:1, march:2, mar:2, april:3, apr:3, may:4,
  june:5, jun:5, july:6, jul:6, august:7, aug:7, september:8, sep:8, sept:8,
  october:9, oct:9, november:10, nov:10, december:11, dec:11,
};
const DAY_WORDS = { monday:0, mon:0, tuesday:1, tue:1, tues:1, wednesday:2, wed:2,
  thursday:3, thu:3, thur:3, friday:4, fri:4, saturday:5, sat:5, sunday:6, sun:6,
  somvar:0, mangalvar:1, budhvar:2, guruvar:3, shukravar:4, shanivar:5, ravivar:6 };

/* ------------------------- date ranges --------------------------- */
function rng(spec) {
  const d = D(), n = d.meta.days, asof = new Date(d.meta.asof + "T00:00:00");
  const mk = (a, b, label) => ({ a: Math.max(0, a), b: Math.min(n - 1, b), label });
  switch (spec.kind) {
    case "today": return mk(n - 1, n - 1, "today");
    case "yesterday": return mk(n - 2, n - 2, "yesterday");
    case "last7": return mk(n - 7, n - 1, "the last 7 days");
    case "last30": return mk(n - 30, n - 1, "the last 30 days");
    case "last90": return mk(n - 90, n - 1, "the last 3 months");
    case "thisweek": {
      const wd = (asof.getDay() + 6) % 7;
      return mk(n - 1 - wd, n - 1, "this week so far");
    }
    case "lastweek": {
      const wd = (asof.getDay() + 6) % 7;
      return mk(n - 1 - wd - 7, n - 2 - wd, "last week");
    }
    case "thismonth": return mk(n - asof.getDate(), n - 1, "this month so far");
    case "lastmonth": {
      const ms = d.monthly.filter(m => (m.days || 30) >= 25);
      const ym = ms[ms.length - 1].ym;
      return ymRange(ym);
    }
    case "month": return ymRange(spec.ym);
    case "year": return mk(0, n - 1, "the whole period");
    default: return mk(n - 30, n - 1, "the last 30 days");
  }
}
function ymRange(ym) {
  const d = D();
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7);
  const base = Date.UTC(+d.meta.day0.slice(0, 4), +d.meta.day0.slice(5, 7) - 1,
                        +d.meta.day0.slice(8, 10));
  const first = Date.UTC(y, m - 1, 1);
  const dim = new Date(Date.UTC(y, m, 0)).getUTCDate();   // days in that month
  const a = Math.round((first - base) / 864e5);
  return { a: Math.max(0, a), b: Math.min(d.meta.days - 1, a + dim - 1),
           label: ymFull(ym), ym };
}
function agg(r) {
  const dl = daily().slice(r.a, r.b + 1);
  const rev = sum(dl.map(x => x.revenue));
  const cg = sum(dl.map(x => x.cogs || 0));
  const tx = sum(dl.map(txOf));
  return { rev, cogs: cg, tx, days: dl.length, rows: dl,
    profit: tracked() ? rev - cg : rev * marginPct() / 100,
    atv: tx ? rev / tx : 0 };
}

/* ------------------------- understanding -------------------------- */
function parse(qRaw) {
  const q = " " + qRaw.toLowerCase().replace(/[?.,!]/g, " ").replace(/\s+/g, " ") + " ";
  const has = (...w) => w.some(x => q.includes(" " + x) || q.includes(x + " "));

  /* --- time range --- */
  let time = null;
  if (has("today", "aaj", "ఈరోజు", "இன்று")) time = { kind: "today" };
  else if (has("yesterday", "kal", "నిన్న", "நேற்று")) time = { kind: "yesterday" };
  else if (has("last week", "pichle hafte", "previous week", "గత వారం", "கடந்த வாரம்")) time = { kind: "lastweek" };
  else if (has("this week", "is hafte", "ఈ వారం", "இந்த வாரம்")) time = { kind: "thisweek" };
  else if (has("last month", "pichle mahine", "pichle mahina", "previous month", "గత నెల", "கடந்த மாதம்")) time = { kind: "lastmonth" };
  else if (has("this month", "is mahine", "ఈ నెల", "இந்த மாதம்")) time = { kind: "thismonth" };
  else if (has("last 7", "past 7", "7 days", "week")) time = { kind: "last7" };
  else if (has("last 30", "past 30", "30 days")) time = { kind: "last30" };
  else if (has("last 3 month", "90 days", "quarter")) time = { kind: "last90" };
  else if (has("this year", "year", "saal", "all time", "overall", "total")) time = { kind: "year" };
  else {
    for (const w in MONTH_WORDS) {
      if (q.includes(" " + w)) {
        const mo = MONTH_WORDS[w], d = D();
        const cand = (d.timing_months || d.monthly.map(m => m.ym))
          .filter(ym => +ym.split("-")[1] - 1 === mo);
        if (cand.length) { time = { kind: "month", ym: cand[cand.length - 1] }; break; }
      }
    }
  }

  /* --- weekday asked about --- */
  let weekday = null;
  for (const w in DAY_WORDS) if (q.includes(" " + w)) { weekday = DAY_WORDS[w]; break; }

  /* --- product named --- */
  let prod = null;
  if (tracked()) {
    const items = D().sku_list;
    let best = null, bestLen = 0;
    for (const p of items) {
      const nm = p.name.toLowerCase();
      const words = nm.split(/[\s,()]+/).filter(w => w.length > 3);
      for (const w of words) {
        if (q.includes(w) && w.length > bestLen) { best = p; bestLen = w.length; }
      }
      if (q.includes(nm)) { best = p; bestLen = 99; }
    }
    prod = best;
  }

  /* --- intent --- */
  const both = (a, b) => has(a) && has(b);
  const asksDay = has("day", "din", "dinn", "రోజు", "நாள்");
  const asksWorst = has("worst", "lowest", "least", "weakest", "slowest", "bad", "kharab", "kam",
                        "poor", "down");
  const asksBest = has("best", "highest", "top", "most", "strongest", "acha", "accha", "zyada");

  let intent = null;
  if (has("most sold", "sold most", "sold the most", "best selling", "best seller", "sells most",
          "sabse zyada", "top product", "most selling", "zyada bika", "highest selling",
          "which product", "what product", "ఎక్కువ అమ్మ", "அதிகம்") && !asksDay)
    intent = "topproduct";
  else if (has("least sold", "worst selling", "slowest", "not selling", "kam bika", "dead stock",
               "not moving"))
    intent = "deadproduct";
  else if (prod && has("when", "what time", "which hour", "kab", "peak", "ఎప్పుడు", "எப்போது"))
    intent = "producttime";
  else if (prod) intent = "productinfo";
  else if (asksDay && asksWorst) intent = "worstday";
  else if (asksDay && asksBest) intent = "bestday";
  else if (has("least earning", "kam kamai", "lowest earning", "sabse kam")) intent = "worstday";
  else if (has("week") && asksWorst) intent = "worstweek";
  else if (has("month", "mahina", "mahine") && asksWorst && !time) intent = "worstmonth";
  else if (has("month", "mahina", "mahine") && asksBest && !time) intent = "bestmonth";
  else if (has("why") && asksWorst && has("week")) intent = "worstweek";
  else if (has("why") && asksWorst) intent = "worstday";
  else if (has("busiest hour", "peak hour", "busy time", "what time", "which hour", "rush",
               "peak time", "kaun sa time"))
    intent = "peakhour";
  else if (has("average", "normal", "typical", "ausat", "సగటు", "சராசரி")) intent = "average";
  else if (has("profit", "margin", "munafa", "bacha", "kept", "earn after", "లాభం", "லாபம்"))
    intent = "profit";
  else if (has("loan", "credit", "borrow", "score", "karz", "udhaar le", "రుణం", "கடன்"))
    intent = "credit";
  else if (has("share", "wallet", "competitor", "blinkit", "zepto", "quick commerce", "losing",
               "leak", "elsewhere", "hissa"))
    intent = "share";
  else if (has("customer", "regular", "grahak", "lapsed", "stopped coming", "కస్టమర్", "வாடிக்கையாளர்"))
    intent = "customers";
  else if (has("how many bill", "how many payment", "how many transaction", "kitne bill",
               "number of bill", "transactions"))
    intent = "count";
  else if (has("compare", "vs", "versus", "better than", "worse than")) intent = "compare";
  else if (has("how much", "kitna", "kitne", "earn", "kamaya", "kamai", "sale", "sales", "revenue",
               "made", "collected", "total", "ఎంత", "எவ்வளவு"))
    intent = "earnings";
  if (!intent && time) intent = "earnings";
  if (!intent && weekday !== null) intent = "weekday";
  return { intent, time, weekday, prod, q: qRaw };
}

/* ---------------------------- answering --------------------------- */
function answer(p) {
  const d = D(), f = F();
  if (!p.intent) return null;
  const R = p.time ? rng(p.time) : rng({ kind: "last30" });

  switch (p.intent) {
    case "earnings": case "count": case "profit": {
      const a = agg(R);
      const prevR = { a: R.a - (R.b - R.a + 1), b: R.a - 1 };
      const pa = prevR.a >= 0 ? agg(prevR) : null;
      const isP = p.intent === "profit", isC = p.intent === "count";
      const val = isP ? a.profit : isC ? a.tx : a.rev;
      const pv = pa ? (isP ? pa.profit : isC ? pa.tx : pa.rev) : null;
      const ch = pv ? (val / pv - 1) * 100 : null;
      return {
        tag: isP && !tracked() ? "g" : "m",
        value: isC ? nf(val) : inrF(val),
        sub: `${isC ? (tracked() ? "bills" : "payments") : isP ? "kept" : "received"} \u00b7 ${R.label}`,
        means: ch == null ? `Over ${a.days} day${a.days === 1 ? "" : "s"}, averaging ${inrF(a.rev / a.days)} a day.`
          : `That is ${pc(ch)} against the ${a.days} days before it` +
            (isP ? `, at a ${(a.profit / a.rev * 100).toFixed(1)}% margin.`
                 : `, from ${nf(a.tx)} ${tracked() ? "bills" : "payments"} of ${inrF(a.atv)} each.`),
        act: ch == null ? null : ch >= 3 ? "Nothing to fix here \u2014 whatever you changed is working."
          : ch <= -3 ? `Open ${t("low")} to see whether fewer people came or they spent less. The fixes are different.`
          : "Flat. Worth looking at your weakest day for the easiest gain.",
        actTab: ch != null && ch <= -3 ? "low" : null,
        est: isP && !tracked(),
        ev: [["Period", `${dLong(dateAt(R.a))} \u2192 ${dLong(dateAt(R.b))}`],
             ["Days counted", nf(a.days)],
             ["Money received", inrF(a.rev)],
             ...(tracked() ? [["Cost of goods", inrF(a.cogs)]] : [["Margin applied", marginPct() + "% (declared)"]]),
             [tracked() ? "Bills" : "Payments", nf(a.tx)],
             ["Average sale", inrF(a.atv)],
             ...(pa ? [["Previous period", inrF(isP ? pa.profit : isC ? pa.tx : pa.rev)]] : [])],
      };
    }
    case "worstday": case "bestday": {
      const w = f.wd.slice().sort((a, b) => a.revenue - b.revenue);
      const x = p.intent === "worstday" ? w[0] : w[w.length - 1];
      const gap = Math.abs(x.revenue - f.wdMean);
      return { tag: "m", value: WDFULL[x.wd],
        sub: `${inrF(x.revenue)} on an average ${WDFULL[x.wd]}`,
        means: `${pc(x.vs_avg)} against your other days. Across a year that is ${inr(gap * 52)} ${p.intent === "worstday" ? "less than a normal day would bring" : "more than a normal day brings"}.`,
        act: p.intent === "worstday"
          ? `Recovering half the gap is worth ${inr(gap * 0.5 * 52)} a year. A standing ${WDFULL[x.wd]} offer is the cheapest way to test it.`
          : `Make sure you never run short of stock or help on a ${WDFULL[x.wd]}.`,
        actTab: "low",
        ev: f.wd.map(y => [WDFULL[y.wd], inrF(y.revenue) + "  (" + pc(y.vs_avg) + ")"]) };
    }
    case "weekday": {
      const x = f.wd[p.weekday];
      return { tag: "m", value: inrF(x.revenue), sub: `on an average ${WDFULL[x.wd]}`,
        means: `${pc(x.vs_avg)} against your other days. ${x.vs_avg < 0 ? "It is one of your weaker days." : "It is one of your stronger days."}`,
        act: x.vs_avg < -8 ? `The gap to a normal day is ${inrF(f.wdMean - x.revenue)} every week \u2014 ${inr((f.wdMean - x.revenue) * 52)} a year.` : null,
        actTab: x.vs_avg < -8 ? "low" : null,
        ev: f.wd.map(y => [WDFULL[y.wd], inrF(y.revenue)]) };
    }
    case "worstweek": case "bestmonth": case "worstmonth": {
      if (p.intent === "worstweek") {
        const w = f.wk.slice(-5, -1).slice().sort((a, b) => a.revenue - b.revenue)[0];
        const m = mean(f.wk.slice(-13, -1).map(x => x.revenue));
        const nTx = mean(f.wk.slice(-13, -1).map(x => x.bills));
        const dTx = (w.bills / nTx - 1) * 100;
        const dAtv = ((w.revenue / w.bills) / (m / nTx) - 1) * 100;
        const why = Math.abs(dTx) > Math.abs(dAtv) * 1.6 ? "fewer people came"
          : Math.abs(dAtv) > Math.abs(dTx) * 1.6 ? "the same people spent less" : "both fell together";
        return { tag: "m", value: inrF(w.revenue),
          sub: `week of ${dLong(new Date(w.w + "T00:00:00"))} \u2014 your weakest recent week`,
          means: `${pc((w.revenue / m - 1) * 100)} against your normal week. Taking it apart: ${why} (${pc(dTx, 0)} people, ${pc(dAtv, 0)} per basket).`,
          act: why.startsWith("fewer")
            ? "That is a footfall problem. Discounting your existing customers will not help \u2014 they already came."
            : "That is a basket problem. Usually it means you were out of stock on something people wanted.",
          actTab: "low",
          ev: f.wk.slice(-5, -1).map(x => ["Week of " + dShort(new Date(x.w + "T00:00:00")),
            inrF(x.revenue) + "  \u00b7  " + nf(x.bills) + " " + (tracked() ? "bills" : "payments")]) };
      }
      const ms = f.full.slice().sort((a, b) => a.revenue - b.revenue);
      const x = p.intent === "worstmonth" ? ms[0] : ms[ms.length - 1];
      const mn = mean(f.full.map(y => y.revenue));
      return { tag: "m", value: inrF(x.revenue), sub: ymFull(x.ym),
        means: `${pc((x.revenue / mn - 1) * 100)} against your average month of ${inrF(mn)}.`,
        act: null, ev: f.full.map(y => [ymFull(y.ym), inrF(y.revenue)]) };
    }
    case "peakhour": {
      const h = f.hr.slice().sort((a, b) => b.revenue - a.revenue);
      const t3 = h.slice(0, 3);
      return { tag: "m", value: h[0].h + ":00",
        sub: `${h[0].share.toFixed(1)}% of a day's money arrives in that hour`,
        means: `Your three busiest hours are ${t3.map(x => x.h + ":00").join(", ")}, carrying ${sum(t3.map(x => x.share)).toFixed(0)}% of everything between them.`,
        act: `Being out of stock or short of help at ${h[0].h}:00 costs more than at any other time of day.`,
        actTab: "trends",
        ev: h.slice(0, 6).map(x => [x.h + ":00 \u2013 " + (x.h + 1) + ":00",
          inrF(x.revenue) + "  (" + x.share.toFixed(1) + "%)"]) };
    }
    case "average": {
      const dl = f.dl.filter(x => x.revenue > 0);
      const ad = mean(dl.map(x => x.revenue));
      return { tag: "m", value: inrF(ad), sub: "on a normal day",
        means: `A normal week is ${inr(ad * 7)} and a normal month ${inr(ad * 30.4)}, from about ${nf(mean(dl.map(txOf)), 0)} ${tracked() ? "bills" : "payments"} a day of ${inrF(ad / mean(dl.map(txOf)))} each.`,
        act: `Anything under ${inrF(dl.map(x => x.revenue).sort((a, b) => a - b)[Math.floor(dl.length * .1)])} is genuinely a slow day for you. One below average means nothing \u2014 five in a row means something.`,
        actTab: "avg",
        ev: [["A normal day", inrF(ad)], ["A normal week", inrF(ad * 7)],
             ["A normal month", inrF(ad * 30.4)],
             ["Days counted", nf(dl.length)],
             ["A really good day", inrF(dl.map(x => x.revenue).sort((a, b) => b - a)[Math.floor(dl.length * .1)])],
             ["A slow day", inrF(dl.map(x => x.revenue).sort((a, b) => a - b)[Math.floor(dl.length * .1)])]] };
    }
    case "topproduct": case "deadproduct": {
      if (!tracked()) return lockedAnswer();
      const items = d.sku_list;
      if (p.time && p.time.kind === "month" && d.top_by_month[p.time.ym]) {
        const x = d.top_by_month[p.time.ym];
        return { tag: "m", value: x.name, sub: `${nf(x.qty)} units in ${ymFull(p.time.ym)}`,
          means: `It brought in ${inrF(x.revenue)} that month.`,
          act: null,
          ev: Object.entries(d.top_by_month).slice(-6).reverse()
            .map(([m, y]) => [ymFull(m), y.name + " \u00b7 " + nf(y.qty) + " units"]) };
      }
      if (p.intent === "deadproduct") {
        const dead = d.dead_stock || [];
        if (!dead.length) return { tag: "m", value: "Nothing", sub: "every item has sold recently",
          means: "No product has gone three weeks without a sale.", act: null, ev: [] };
        const x = dead[0];
        return { tag: "m", value: x.name, sub: `nothing sold for ${x.days_since_sale} days`,
          means: `${x.on_hand} units are sitting on the shelf, which is ${inrF(x.value)} of your money doing nothing. ${dead.length} items are in this state, worth ${inr(d.totals.dead_capital)} together.`,
          act: "Bundle it with something that sells fast, or clear it at a discount and put the cash into stock that moves.",
          actTab: "prod",
          ev: dead.slice(0, 6).map(y => [y.name, y.on_hand + " units \u00b7 " + y.days_since_sale + " days quiet \u00b7 " + inrF(y.value)]) };
      }
      const x = items[0], tm = d.timing[x.sku] || {};
      const byQty = items.slice().sort((a, b) => b.qty - a.qty)[0];
      return { tag: "m", value: x.name,
        sub: `${inr(x.revenue)} over the year \u00b7 ${nf(x.qty)} units`,
        means: `By units the busiest is ${byQty.name} at ${nf(byQty.qty)}. ${x.name} earns most because of its price, at a ${x.margin_pct.toFixed(1)}% margin.`,
        act: tm.peak_hour != null
          ? `It sells hardest around ${tm.peak_hour}:00 and on ${tm.peak_wd}. Keep it stocked before that, not after.`
          : null,
        actTab: "prod",
        ev: items.slice(0, 6).map(y => [y.name, inrF(y.revenue) + " \u00b7 " + nf(y.qty) + " units"]) };
    }
    case "producttime": {
      if (!tracked()) return lockedAnswer();
      const x = p.prod, tm = d.timing[x.sku] || {};
      return { tag: "m", value: (tm.peak_hour ?? "?") + ":00",
        sub: `when ${x.name} sells hardest`,
        means: `${tm.hour_share}% of it goes in that single hour. Its best day is ${tm.peak_wd} and its best month was ${ymFull(tm.peak_month)}.`,
        act: tm.hour_share >= 14
          ? `Being empty at ${tm.peak_hour}:00 does not delay the sale \u2014 it loses it. Restock before then.`
          : "It sells steadily through the day, so a short gap hurts less here.",
        actTab: "prod",
        ev: (d.timing_hours || []).map((h, i) => [h + ":00", nf(tm.hours[i]) + " units"])
          .filter((_, i) => tm.hours[i] > 0).slice(0, 8) };
    }
    case "productinfo": {
      if (!tracked()) return lockedAnswer();
      const x = p.prod, tm = d.timing[x.sku] || {};
      return { tag: "m", value: inr(x.revenue), sub: `${x.name} over the year`,
        means: `${nf(x.qty)} units at a ${x.margin_pct.toFixed(1)}% margin, which left you ${inr(x.gross_profit)}. It appeared in ${nf(x.bills)} bills.`,
        act: tm.peak_hour != null ? `Peaks at ${tm.peak_hour}:00, best on ${tm.peak_wd}.` : null,
        actTab: "prod",
        ev: [["Units sold", nf(x.qty)], ["Money", inrF(x.revenue)],
             ["Cost of goods", inrF(x.cogs)], ["Kept", inrF(x.gross_profit)],
             ["Margin", x.margin_pct.toFixed(1) + "%"], ["On the shelf now", nf(x.on_hand)]] };
    }
    case "credit": {
      const c = d.credit, cf = d.cashflow;
      const gap = Math.max(0, cf.peak_stock_need - Math.max(cf.net30, 0));
      return { tag: "m", value: inr(c.limit), sub: `pre-approved at ${c.rate}% for ${c.tenor_months} months`,
        means: `Your score is ${c.score} (${c.band}), worked out from ${nf(d.meta.days)} days of your own payments \u2014 no paperwork. EMI would be ${inrF(c.emi)}.`,
        act: gap > 0
          ? `You are projected to be short by about ${inr(gap)} around ${cf.peak_window_start}. That is when to take it, not after.`
          : "You are not projected to be short, so there is no reason to borrow right now.",
        actTab: "credit",
        ev: c.drivers.map(x => [x.f, x.v + (/^[% ]/.test(x.unit) ? x.unit : " " + x.unit)]) };
    }
    case "share": {
      const s = SHARE();
      return { tag: "s", value: s.share_pct + "%", sub: "of what your own regulars spend nearby",
        means: `They spend about ${inr(s.wallet)} a month on what you sell. ${inr(s.from_known)} comes to you. Your share has moved ${s.share_change} points over the year.`,
        act: `${s.switchers.count} of them moved part of their basket to quick commerce \u2014 that alone is ${inr(s.switchers.annual_loss)} a year.`,
        actTab: "share", est: true,
        ev: s.leakage.map(l => [l.where, inrF(l.amount) + " a month  (" + pc(l.trend, 0) + ")"]) };
    }
    case "customers": {
      const c = d.customers;
      return { tag: "m", value: nf(c.total), sub: "customers Tracker can recognise",
        means: `${c.attributed_share}% of your sales come from a payer it has seen before. The top 20% of them bring ${c.pareto}% of that money. ${c.winback.length} regulars have gone quiet.`,
        act: c.winback.length ? `Those ${c.winback.length} are worth about ${inr(c.at_risk)} over three months. A small cashback is the cheapest way to test whether they come back.` : null,
        actTab: "share",
        ev: c.segments.map(s => [s.segment, nf(s.customers) + " people \u00b7 " + inrF(s.revenue)]) };
    }
    case "compare": {
      const a = agg(rng({ kind: "thismonth" })), b = agg(rng({ kind: "lastmonth" }));
      return { tag: "m", value: pc((a.rev / b.rev - 1) * 100),
        sub: "this month so far against last month",
        means: `${inrF(a.rev)} over ${a.days} days against ${inrF(b.rev)} over ${b.days}. Per day that is ${inrF(a.rev / a.days)} against ${inrF(b.rev / b.days)}.`,
        act: a.rev / a.days >= b.rev / b.days ? "Running ahead on a per-day basis." : "Running behind on a per-day basis \u2014 worth checking your weakest day.",
        actTab: "low",
        ev: [["This month so far", inrF(a.rev) + " over " + a.days + " days"],
             ["Last month", inrF(b.rev) + " over " + b.days + " days"],
             ["Per day now", inrF(a.rev / a.days)], ["Per day then", inrF(b.rev / b.days)]] };
    }
  }
  return null;
}
function lockedAnswer() {
  return { tag: "g", value: "I cannot tell you that", sub: "this shop does not record what it sells",
    means: "A payment only says how much arrived, never what was in the bag. There is no item data to look at.",
    act: "Start recording bills and this becomes answerable, along with profit per item and reorder alerts.",
    actTab: null, locked: true, ev: [] };
}

/* Arithmetic in code, language from the model. If the model is not
   reachable, the code answer is shown on its own. */
async function askNow(q, srcLang) {
  S.chat.push({ typing: true });
  renderFeed();
  let a = null;
  if (SV.on) {
    try {
      a = await svAsk(q);
      SV.lastErr = null;
    } catch (e) {
      SV.lastErr = e.message;
      a = answer(parse(q));
      if (a) a.degraded = e.message;
    }
  } else {
    await new Promise(r => setTimeout(r, 360));
    a = answer(parse(q));
  }
  S.chat.pop();
  S.chat.push({ a });
  renderFeed();
  if (a && S.speak) {
    if (SV.on) {
      svSpeak(a, srcLang).catch(() => speak(a));
    } else speak(a);
  }
}
window.askNow = askNow;

/* ------------------------------ voice ----------------------------- */
function speak(a) {
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const txt = `${a.value}. ${a.sub}. ${a.means}${a.act ? " " + a.act : ""}`;
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = VOICE[S.lang] || "en-IN";
    u.rate = 0.98;
    const v = speechSynthesis.getVoices().find(x => x.lang === u.lang);
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { /* speaking is a bonus, never a requirement */ }
}
function toggleSpeak() {
  S.speak = !S.speak;
  if (!S.speak && window.speechSynthesis) speechSynthesis.cancel();
  const b = document.getElementById("sndBtn");
  b.className = "snd" + (S.speak ? " on" : "");
  b.innerHTML = ic(S.speak ? "vol" : "mute", 19);
}
window.toggleSpeak = toggleSpeak;

let REC = null, RECING = false;
function micToggle() {
  if (SV.on) return svListen();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = document.getElementById("micBtn");
  if (!SR) return micBlocked("This browser has no speech recognition.");
  if (RECING) { try { REC.stop(); } catch (e) {} return; }
  try {
    REC = new SR();
    REC.lang = VOICE[S.lang] || "en-IN";
    REC.interimResults = false;
    REC.maxAlternatives = 1;
    REC.onstart = () => { RECING = true; btn.classList.add("rec"); };
    REC.onend = () => { RECING = false; btn.classList.remove("rec"); };
    REC.onerror = e => {
      RECING = false; btn.classList.remove("rec");
      if (e.error === "not-allowed" || e.error === "service-not-allowed")
        micBlocked("The microphone is blocked here.");
    };
    REC.onresult = e => ask(e.results[0][0].transcript);
    REC.start();
  } catch (e) { micBlocked("The microphone could not start."); }
}
function micBlocked(why) {
  say("Speaking your question", `<p>${esc(why)}</p>
    <p>A published page runs inside a sandbox that <b>blocks microphone access</b>, so voice input
    cannot work here. Open the same file directly in a browser and it does.</p>
    <p>Everything else works: <b>type your question</b> and Tracker will still read the answer out
    loud in ${esc({ en: "English", hi: "Hindi", te: "Telugu", ta: "Tamil" }[S.lang])}.</p>`);
}
window.micToggle = micToggle;

svLoad();
